{
  id:"dynamodb", ch:11, icon:"⚡", name:"DynamoDB NoSQL", label:"챕터 11 · DynamoDB — 완전관리형 NoSQL",
  doneMsg:"DynamoDB 콘솔에서 Music 테이블을 파티션 키 Artist·정렬 키 SongTitle 로 만들고, 온디맨드 용량과 GSI 를 설정한 뒤 항목 탐색에서 첫 항목까지 넣어봤어요. 서버 관리 없이 자동 확장되는 NoSQL 의 흐름을 실제 콘솔 그대로 체험 완료!",
  steps:[
    { title:"DynamoDB 열기", needs:1,
      intro:`${term("NoSQL","정해진 표 스키마 없이 키-값·문서 형태로 유연하게 저장하는 DB. 대용량·고속 처리에 강합니다")} 데이터베이스인 ${term("DynamoDB","서버 관리가 전혀 없고 트래픽에 맞춰 자동 확장되는 AWS 완전관리형 키-값 NoSQL")} 를 엽니다. 서울 리전 콘솔에서 카드를 눌러보세요.`,
      console:`<div class="scr"><h4>콘솔 홈 · 서울</h4><p class="sub">NoSQL 데이터베이스</p><div class="svc ck" data-key="open"><span class="sic" style="background:#4053d6">⚡</span><div><div class="nm">DynamoDB</div><div class="ds">완전관리형 키-값 NoSQL</div></div></div></div>`,
      cli:{ note:`지금 있는 테이블 목록을 먼저 봅니다.`,
        lines:[ {cmt:"# 테이블 목록 조회 (서울 리전)"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("list-tables","테이블 목록 조회")}, {out:"TableNames: []"} ],
        copy:"aws dynamodb list-tables --region ap-northeast-2",
        help:`<b>팁</b> DynamoDB 는 서버 대수·패치·백업을 신경 쓸 필요가 없어요. 테이블만 만들면 끝입니다.` } },

    { title:"테이블 세부 정보 입력", needs:1,
      intro:`${term("테이블 생성","Create table. 새 DynamoDB 테이블을 만드는 화면을 여는 버튼")} 을 누르면 세부 정보 화면이 뜹니다. 모든 항목을 흩뿌려 저장할 기준이 되는 ${term("파티션 키","Partition key. 항목을 여러 서버(파티션)에 나눠 담는 기준 키. 값이 고르게 퍼지도록 골라야 함")} 로 Artist(문자열), 같은 파티션 안에서 순서를 매기는 ${term("정렬 키","Sort key. 선택 사항. 같은 파티션 키 안에서 항목을 정렬·범위 조회하는 두 번째 키")} 로 SongTitle 이 예시로 채워져 있어요. 한곳에만 요청이 몰리는 ${term("핫 파티션","특정 파티션 키 값에 트래픽이 집중돼 느려지는 현상. 키를 고르게 분산해 피함")} 을 피하려면 값이 골고루 퍼지는 키가 좋습니다. 다음 라디오로 넘어가려면 화면을 확인하세요.`,
      console:`<div class="scr"><h4>테이블 생성</h4><p class="sub">테이블 세부 정보</p><div class="field"><label>테이블 이름</label><div class="input prefilled">Music <span class="tag">입력됨</span></div></div><div class="field"><label>파티션 키</label><div class="input prefilled">Artist (문자열) <span class="tag">입력됨</span></div></div><div class="field"><label>정렬 키 - 선택 사항</label><div class="input prefilled">SongTitle (문자열) <span class="tag">입력됨</span></div></div><div class="opt ck" data-key="next"><span class="rd"></span><div><div class="nm">세부 정보 확인</div><div class="ds">이름·파티션 키·정렬 키 확정</div></div></div></div>`,
      cli:{ note:`키 스키마와 속성 정의를 함께 넘깁니다.`,
        lines:[ {cmt:"# Artist=파티션(HASH), SongTitle=정렬(RANGE)"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("create-table","테이블 생성")}, {out:"TableStatus: CREATING -> ACTIVE"} ],
        copy:"aws dynamodb create-table --table-name Music --attribute-definitions AttributeName=Artist,AttributeType=S AttributeName=SongTitle,AttributeType=S --key-schema AttributeName=Artist,KeyType=HASH AttributeName=SongTitle,KeyType=RANGE --billing-mode PAY_PER_REQUEST",
        help:`<b>팁</b> ${term("강한 일관성","Strongly consistent read. 방금 쓴 값을 바로 정확히 읽는 옵션. 기본은 약간 지연될 수 있는 최종 일관성 읽기")} 읽기가 필요하면 조회 시 옵션으로 켤 수 있어요.` } },

    { title:"설정 · 용량 모드 선택", needs:1,
      intro:`${term("설정 사용자 지정","Customize settings. 용량·암호화·인덱스 등을 직접 정하는 모드. 기본 설정(Default settings)은 권장값 자동 적용")} 을 고르면 용량 모드를 바꿀 수 있어요. ${term("온디맨드","On-demand. 미리 용량을 정하지 않고 쓴 만큼만 내는 방식. 트래픽이 들쭉날쭉하거나 예측이 어려울 때 편함")} 를 고르면 설정이 간단하고 자동으로 확장됩니다. ${term("프로비저닝","Provisioned. 초당 읽기·쓰기 용량(RCU/WCU)을 미리 정해두는 방식. 트래픽이 일정하면 더 저렴")} 는 비교용이에요. 온디맨드 라디오를 선택하세요.`,
      console:`<div class="scr"><h4>설정</h4><p class="sub">읽기/쓰기 용량 설정</p><div class="opt ck" data-key="ondemand"><span class="rd"></span><div><div class="nm">온디맨드 (On-demand)</div><div class="ds">쓴 만큼 과금 · 자동 확장</div></div></div><div class="opt ck" data-key="provisioned"><span class="rd"></span><div><div class="nm">프로비저닝 (Provisioned)</div><div class="ds">용량 미리 지정 · 예측 트래픽용</div></div></div></div>`,
      cli:{ note:`--billing-mode 로 모드를 지정합니다.`,
        lines:[ {cmt:"# 온디맨드 = PAY_PER_REQUEST"}, {p:"$",cmd:` aws dynamodb update-table`,flagHtml:flag("--billing-mode","용량 모드 지정")}, {out:"BillingMode: PAY_PER_REQUEST"} ],
        copy:"aws dynamodb update-table --table-name Music --billing-mode PAY_PER_REQUEST",
        help:`<b>팁</b> 처음엔 온디맨드로 시작해 트래픽 패턴이 보이면 프로비저닝으로 바꿔 비용을 아끼는 경우가 많아요.` } },

    { title:"보조 인덱스(GSI) 추가 · 테이블 생성", needs:2,
      intro:`파티션 키가 아닌 다른 속성으로도 빠르게 찾으려면 ${term("GSI","Global Secondary Index. 다른 속성을 키로 삼아 전체 테이블을 가로질러 조회하는 보조 색인. 생성 후에도 아무 때나 추가 가능")} 를 추가합니다. 같은 파티션 키 안에서 정렬 키만 다르게 두는 ${term("LSI","Local Secondary Index. 파티션 키는 그대로 두고 정렬 키만 다르게 두는 보조 색인. 테이블 생성 시에만 만들 수 있음")} 와 구분하세요. AlbumTitle 로 찾는 GSI 체크박스를 켠 뒤 테이블 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>보조 인덱스</h4><p class="sub">다른 속성으로도 조회하려면</p><div class="opt ck" data-key="gsi"><span class="ck-box"></span><div><div class="nm">글로벌 보조 인덱스 생성: AlbumTitle-index</div><div class="ds">AlbumTitle 속성으로 전체 조회</div></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">테이블 생성</button></div></div>`,
      cli:{ note:`인덱스 정의를 추가하는 명령입니다.`,
        lines:[ {cmt:"# AlbumTitle 을 키로 하는 GSI 추가"}, {p:"$",cmd:` aws dynamodb update-table`,flagHtml:flag("--global-secondary-index-updates","GSI 추가/변경")}, {out:"IndexStatus: CREATING -> ACTIVE"} ],
        copy:"aws dynamodb update-table --table-name Music --attribute-definitions AttributeName=AlbumTitle,AttributeType=S --global-secondary-index-updates [{\"Create\":{\"IndexName\":\"AlbumTitle-index\",\"KeySchema\":[{\"AttributeName\":\"AlbumTitle\",\"KeyType\":\"HASH\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}}]",
        help:`<b>정리</b> GSI = 아무 속성·언제든 추가, LSI = 생성 시에만·같은 파티션 키. 용도를 구분하세요.` } },

    { title:"항목 탐색 · 항목 생성", needs:1,
      intro:`테이블이 만들어지면 왼쪽 ${term("항목 탐색","Explore items. 테이블에 저장된 항목을 조회·추가·수정하는 화면")} 으로 들어가 ${term("항목 생성","Create item. 테이블에 새 데이터(항목) 하나를 넣는 버튼")} 을 누릅니다. Artist 와 SongTitle 이 미리 채워져 있으니 항목 생성 버튼만 누르면 돼요.`,
      console:`<div class="scr"><h4>항목 탐색 &gt; 항목 생성</h4><p class="sub">Music 테이블에 항목 추가</p><div class="field"><label>Artist (파티션 키)</label><div class="input prefilled">IU <span class="tag">입력됨</span></div></div><div class="field"><label>SongTitle (정렬 키)</label><div class="input prefilled">Love wins all <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="putitem">항목 생성</button></div></div>`,
      cli:{ note:`항목 하나를 JSON 으로 저장합니다.`,
        lines:[ {cmt:"# Music 테이블에 항목 1개 추가"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("put-item","항목 저장")}, {out:"(성공 · 반환값 없음)"} ],
        copy:"aws dynamodb put-item --table-name Music --item {\"Artist\":{\"S\":\"IU\"},\"SongTitle\":{\"S\":\"Love wins all\"}}",
        help:`<b>팁</b> 항목마다 속성 구성이 달라도 됩니다. 스키마가 고정되지 않은 게 NoSQL 의 특징이에요.` } },

    { title:"완료", finish:true,
      intro:`축하합니다! 서버 관리 없이 자동 확장되는 NoSQL 테이블을 만들고 첫 데이터까지 넣어봤어요. 확인 버튼으로 마무리하세요.`,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ Music 테이블 준비 완료</h4><div class="rowsum"><span class="k">테이블</span><span class="v">Music</span></div><div class="rowsum"><span class="k">파티션 키</span><span class="v">Artist</span></div><div class="rowsum"><span class="k">정렬 키</span><span class="v">SongTitle</span></div><div class="rowsum"><span class="k">용량 모드</span><span class="v">온디맨드</span></div><div class="rowsum"><span class="k">GSI</span><span class="v">AlbumTitle-index</span></div><div class="rowsum"><span class="k">첫 항목</span><span class="v">IU / Love wins all</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">실습 마치기</button></div></div>`,
      cli:{ note:`방금 넣은 항목을 다시 조회해 확인합니다.`,
        lines:[ {cmt:"# 파티션 키로 항목 조회"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("get-item","항목 1건 조회")}, {out:"Item: { Artist: IU, SongTitle: Love wins all }"} ],
        copy:"aws dynamodb get-item --table-name Music --key {\"Artist\":{\"S\":\"IU\"},\"SongTitle\":{\"S\":\"Love wins all\"}}",
        help:`수고했어요! 파티션 키·정렬 키·GSI·온디맨드까지 실제 콘솔 흐름 그대로 NoSQL 테이블을 익혔습니다.` } }
  ]
},
{
  id:"analytics", ch:12, icon:"🔍", name:"Athena·Glue", label:"챕터 12 · 분석 — Glue 크롤러 + Athena 로 S3 를 SQL 쿼리",
  doneMsg:"Glue 크롤러로 S3 데이터의 스키마를 자동 생성하고, Athena 쿼리 편집기에서 결과 위치를 지정한 뒤 SELECT 쿼리를 실행해 결과까지 확인했어요. 서버 한 대 없이 데이터 레이크를 SQL 로 분석하는 흐름을 실제 콘솔 그대로 체험 완료!",
  steps:[
    { title:"AWS Glue 열기", needs:1,
      intro:`먼저 ${term("Glue","데이터를 정리·변환하는 ETL 작업과 데이터 카탈로그를 담당하는 서버리스 서비스")} 를 엽니다. Glue 의 ${term("크롤러","Crawler. S3 등 데이터 원본을 훑어 컬럼·타입을 알아내고 표(스키마)를 자동 생성해 데이터 카탈로그에 등록하는 도구")} 가 ${term("데이터 레이크","가공하지 않은 원본 데이터를 형식 그대로 모아 두는 대형 저장소. 보통 S3")} 의 표 구조를 자동으로 만들어 줍니다. 보라색 카드를 클릭하세요.`,
      console:`<div class="scr"><h4>콘솔 홈 · 서울</h4><p class="sub">분석을 시작할 서비스를 엽니다</p><div class="svc ck" data-key="open"><span class="sic" style="background:#8c4fff">🧩</span><div><div class="nm">AWS Glue</div><div class="ds">크롤러 · 데이터 카탈로그 · ETL</div></div></div><div class="svc locked"><span class="sic" style="background:#c7417b">📊</span><div><div class="nm">Amazon Redshift</div><div class="ds">데이터 웨어하우스</div></div></div></div>`,
      cli:{ note:`CLI 에서는 등록된 크롤러 목록부터 확인합니다.`,
        lines:[ {cmt:"# 등록된 크롤러 보기"}, {p:"$",cmd:` aws glue `,flagHtml:flag("list-crawlers","크롤러 목록 조회")}, {out:"CrawlerNames: []"} ],
        copy:"aws glue list-crawlers --region ap-northeast-2",
        help:`<b>Glue</b> 는 데이터가 어디에 어떤 구조로 있는지 적어 두는 데이터 카탈로그 역할을 합니다.` } },

    { title:"크롤러 생성", needs:1,
      intro:`왼쪽 메뉴 크롤러에서 ${term("크롤러 생성","Create crawler. 데이터 원본을 스캔할 크롤러를 만드는 마법사")} 를 누릅니다. 마법사는 이름 지정 → 데이터 원본(S3 경로) → ${term("IAM 역할","Glue 가 S3·카탈로그에 접근하도록 권한을 주는 서비스 역할. 크롤러 실행에 필수")} 선택 → 대상 데이터베이스 → 검토·생성 순서예요. 이름·S3 경로·역할·대상 DB 가 미리 채워져 있으니 크롤러 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>크롤러 생성</h4><p class="sub">속성 · 데이터 원본 · 보안 · 출력</p><div class="field"><label>크롤러 이름</label><div class="input prefilled">sales-crawler <span class="tag">입력됨</span></div></div><div class="field"><label>데이터 원본 (S3)</label><div class="input prefilled">s3://my-datalake/sales/ <span class="tag">입력됨</span></div></div><div class="field"><label>IAM 역할</label><div class="input prefilled">AWSGlueServiceRole-sales <span class="tag">입력됨</span></div></div><div class="field"><label>대상 데이터베이스</label><div class="input prefilled">sales_db <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">크롤러 생성</button></div></div>`,
      cli:{ note:`CLI 로는 원본·역할·대상 DB 를 한 번에 지정해 만듭니다.`,
        lines:[ {cmt:"# S3 원본을 훑을 크롤러 생성"}, {p:"$",cmd:` aws glue `,flagHtml:flag("create-crawler","크롤러 생성")}, {out:"크롤러 sales-crawler 생성됨"} ],
        copy:"aws glue create-crawler --name sales-crawler --role AWSGlueServiceRole-sales --database-name sales_db --targets S3Targets=[{Path=s3://my-datalake/sales/}]",
        help:`<b>팁</b> 데이터 원본은 S3 외에 JDBC(RDS)·DynamoDB 도 지정할 수 있습니다.` } },

    { title:"크롤러 실행해 스키마 만들기", needs:1,
      intro:`만든 크롤러를 선택하고 ${term("실행","Run. 크롤러를 돌려 데이터 원본을 스캔하는 동작")} 버튼을 누르면 S3 폴더의 파일을 스캔해 컬럼 이름과 타입을 자동으로 알아내 테이블을 만듭니다. 타이핑 없이 버튼 한 번이면 끝. 실행 버튼을 눌러 보세요.`,
      console:`<div class="scr"><h4>sales-crawler</h4><p class="sub">대상 경로를 스캔해 표 구조를 생성합니다</p><div class="rowsum"><span class="k">대상 S3</span><span class="v">s3://my-datalake/sales/</span></div><div class="rowsum"><span class="k">출력 DB</span><span class="v">sales_db</span></div><div class="rowsum"><span class="k">상태</span><span class="v">Ready</span></div><div class="btnrow"><button class="btn primary ck" data-key="run">크롤러 실행</button></div></div>`,
      cli:{ note:`CLI 로는 이렇게 크롤러를 시작합니다.`,
        lines:[ {cmt:"# S3 를 훑어 스키마 생성"}, {p:"$",cmd:` aws glue `,flagHtml:flag("start-crawler","지정한 크롤러 실행")}, {out:"크롤러 시작됨  →  테이블 sales 생성됨 (컬럼 5개)"} ],
        copy:"aws glue start-crawler --name sales-crawler",
        help:`<b>팁</b> 크롤러가 끝나면 데이터 카탈로그에 sales_db.sales 표가 생겨 바로 SQL 로 조회할 수 있습니다.` } },

    { title:"Athena 쿼리 결과 위치 지정", needs:1,
      intro:`이제 ${term("Athena","S3 에 있는 데이터를 SQL 로 바로 조회하는 서버리스 분석 서비스. 스캔한 데이터 양만큼만 과금")} 로 갑니다. 처음 쿼리를 실행하려면 ${term("쿼리 결과 위치","Query result location. 쿼리 결과를 저장할 S3 경로. 설정 탭에서 지정해야 첫 쿼리가 실행됨")} 를 먼저 지정해야 해요. 쿼리 편집기의 설정 탭에서 관리를 눌러 S3 경로를 저장합니다. 결과 위치 저장 버튼을 누르세요.`,
      console:`<div class="scr"><h4>쿼리 편집기 &gt; 설정</h4><p class="sub">쿼리 결과 위치 관리(Manage)</p><div class="field"><label>쿼리 결과 위치 (S3)</label><div class="input prefilled">s3://my-athena-results/ <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="setloc">저장</button></div></div>`,
      cli:{ note:`CLI 에서는 작업 그룹에 결과 위치를 설정합니다.`,
        lines:[ {cmt:"# primary 작업 그룹에 결과 위치 지정"}, {p:"$",cmd:` aws athena `,flagHtml:flag("update-work-group","작업 그룹 설정 변경")}, {out:"OutputLocation: s3://my-athena-results/"} ],
        copy:"aws athena update-work-group --work-group primary --configuration-updates ResultConfigurationUpdates={OutputLocation=s3://my-athena-results/}",
        help:`<b>Athena</b> 는 Glue 카탈로그에 등록된 표를 그대로 SQL 대상으로 쓰고, 결과는 이 S3 위치에 저장합니다.` } },

    { title:"데이터베이스 선택 · 쿼리 실행", needs:2,
      intro:`쿼리 편집기 왼쪽에서 데이터 원본(AwsDataCatalog)과 ${term("데이터베이스","크롤러가 만든 sales_db. FROM 절에서 쓸 표들이 들어 있는 묶음")} sales_db 를 고릅니다. 상위 10개 행을 보는 SELECT 쿼리가 미리 작성돼 있으니, 데이터베이스를 선택하고 실행 버튼을 누르면 Athena 가 S3 를 직접 읽어 결과를 돌려줍니다.`,
      console:`<div class="scr"><h4>쿼리 편집기</h4><p class="sub">데이터 원본: AwsDataCatalog</p><div class="opt ck" data-key="db"><span class="rd"></span><div><div class="nm">sales_db</div><div class="ds">크롤러가 생성한 판매 데이터</div></div></div><div class="term"><span class="line out">SELECT * FROM sales_db.sales</span><span class="line out">LIMIT 10;</span></div><div class="btnrow"><button class="btn primary ck" data-key="run">실행</button></div></div>`,
      cli:{ note:`CLI 로 쿼리를 제출하면 실행 ID 가 돌아옵니다.`,
        lines:[ {cmt:"# 쿼리 비동기 실행"}, {p:"$",cmd:` aws athena `,flagHtml:flag("start-query-execution","쿼리 실행 요청")}, {out:"QueryExecutionId: q-1a2b3c"} ],
        copy:"aws athena start-query-execution --query-string \"SELECT * FROM sales_db.sales LIMIT 10\" --query-execution-context Database=sales_db --result-configuration OutputLocation=s3://my-athena-results/",
        help:`Athena 는 쿼리를 비동기로 처리하고, 결과는 지정한 S3 위치에 저장합니다.` } },

    { title:"결과 확인 · 완료", finish:true,
      intro:`쿼리가 끝났습니다. 로그·텍스트 검색 분석이 필요하면 ${term("OpenSearch","텍스트 검색과 로그·지표 분석에 특화된 서비스")} 를, 상시 대규모 집계에는 ${term("Redshift","여러 데이터를 모아 두고 빠르게 집계·분석하는 데이터 웨어하우스")} 를 쓰면 됩니다. 아래 버튼으로 마무리하세요.`,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ 쿼리 성공</h4><p class="sub">sales 상위 10행</p><div class="term"><span class="line out">region  amount   date</span><span class="line out">서울    120000   2026-10-01</span><span class="line out">부산     81000   2026-10-01</span><span class="line out">대구     53000   2026-10-02</span><span class="line out">(10행 · 스캔 1.2MB)</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">실습 마치기</button></div></div>`,
      cli:{ note:`저장된 결과를 내려받아 확인합니다.`,
        lines:[ {cmt:"# 실행 결과 조회"}, {p:"$",cmd:` aws athena `,flagHtml:flag("get-query-results","쿼리 결과 가져오기")}, {out:"10 rows returned"} ],
        copy:"aws athena get-query-results --query-execution-id q-1a2b3c",
        help:`끝! 스캔한 데이터 양만큼만 과금됩니다. 파일을 Parquet 로 압축하면 비용이 크게 줄어요.` } }
  ]
},
{
  id:"messaging", ch:13, icon:"📨", name:"SQS·SNS", label:"챕터 13 · 메시징·통합 — 큐와 발행/구독으로 느슨하게 연결",
  doneMsg:"SQS 표준 대기열과 SNS 표준 주제를 만들고 이메일 구독까지 건 뒤, EventBridge 규칙으로 이벤트를 주제에 연결했어요. 서비스끼리 직접 붙지 않고 메시지로 느슨하게 통신하는 구조를 실제 콘솔 그대로 체험 완료!",
  steps:[
    { title:"SQS 열기", needs:1,
      intro:`먼저 ${term("SQS","Simple Queue Service. 메시지를 잠시 쌓아 두는 큐로, 보내는 쪽과 받는 쪽을 분리하는 완전관리형 비동기 버퍼")} 를 엽니다. 서울 리전 콘솔에서 카드를 눌러보세요.`,
      console:`<div class="scr"><h4>콘솔 홈 · 서울</h4><p class="sub">애플리케이션 통합 서비스</p><div class="svc ck" data-key="open"><span class="sic" style="background:#cd2264">📨</span><div><div class="nm">Amazon SQS</div><div class="ds">메시지 대기열 · 비동기 버퍼</div></div></div></div>`,
      cli:{ note:`지금 있는 대기열 목록을 먼저 봅니다.`,
        lines:[ {cmt:"# 대기열 목록 조회 (서울 리전)"}, {p:"$",cmd:` aws sqs `,flagHtml:flag("list-queues","대기열 목록 조회")}, {out:"(아직 없음)"} ],
        copy:"aws sqs list-queues --region ap-northeast-2",
        help:`<b>SQS</b> 는 생산자와 소비자를 떼어 놓아, 소비자가 느리거나 잠깐 죽어도 메시지가 큐에 안전하게 남습니다.` } },

    { title:"대기열 생성", needs:2,
      intro:`${term("대기열 생성","Create queue. 새 SQS 큐를 만드는 화면")} 에서 유형을 고릅니다. 순서가 꼭 필요하고 중복을 막아야 하면 ${term("FIFO","First-In-First-Out. 먼저 넣은 메시지가 먼저 나오고 중복을 제거하는 큐 유형. 이름이 .fifo 로 끝남")} 를, 그렇지 않으면 처리량이 큰 표준을 고르세요. 구성 섹션의 ${term("가시성 제한 시간","Visibility timeout. 한 소비자가 꺼내 처리하는 동안 다른 소비자에게 안 보이게 하는 시간. 기본 30초. 넘기면 다시 큐에 보여 재처리됨")} 은 기본 30초예요. 표준을 선택하고 대기열 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>대기열 생성</h4><p class="sub">세부 정보 · 구성</p><div class="opt ck" data-key="std"><span class="rd"></span><div><div class="nm">표준 (Standard)</div><div class="ds">높은 처리량 · 순서 대체로 유지 · 최소 1회 전달</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">FIFO</div><div class="ds">엄격한 순서 · 정확히 1회 처리</div></div></div><div class="field"><label>이름</label><div class="input prefilled">my-queue <span class="tag">입력됨</span></div></div><div class="field"><label>표시 제한 시간(Visibility timeout)</label><div class="input prefilled">30초 <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">대기열 생성</button></div></div>`,
      cli:{ note:`CLI 로는 한 줄이면 큐가 생깁니다.`,
        lines:[ {cmt:"# 표준 큐 생성"}, {p:"$",cmd:` aws sqs `,flagHtml:flag("create-queue","큐 생성")}, {out:"QueueUrl: .../my-queue"} ],
        copy:"aws sqs create-queue --queue-name my-queue --attributes VisibilityTimeout=30",
        help:`${term("DLQ","Dead Letter Queue. 정해진 횟수만큼 처리에 실패한 메시지를 옮겨 담는 별도의 큐. 원인 추적에 사용")} 를 재처리 정책으로 연결해 두면 실패 메시지를 따로 모아 추적할 수 있어요.` } },

    { title:"SNS 주제 생성", needs:2,
      intro:`이제 ${term("SNS","Simple Notification Service. 하나의 메시지를 구독한 여러 대상에게 한꺼번에 뿌리는 발행/구독(pub/sub) 팬아웃 서비스")} 로 가서 ${term("주제 생성","Create topic. 발행/구독의 중심이 되는 주제(Topic)를 만드는 화면")} 를 누릅니다. 유형은 표준을 고르고, 이름 my-topic 은 미리 채워져 있어요. 주제에 메시지를 한 번 발행하면 구독자 전원에게 복사되어 전달됩니다. 표준을 선택하고 주제 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>주제 생성</h4><p class="sub">세부 정보</p><div class="opt ck" data-key="std"><span class="rd"></span><div><div class="nm">표준 (Standard)</div><div class="ds">높은 처리량 · 최소 1회 전달</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">FIFO</div><div class="ds">엄격한 순서 · 중복 제거</div></div></div><div class="field"><label>이름</label><div class="input prefilled">my-topic <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">주제 생성</button></div></div>`,
      cli:{ note:`CLI 로 주제를 만들면 ARN 이 돌아옵니다.`,
        lines:[ {cmt:"# 표준 주제 생성"}, {p:"$",cmd:` aws sns `,flagHtml:flag("create-topic","SNS 주제 생성")}, {out:"TopicArn: arn:aws:sns:ap-northeast-2:...:my-topic"} ],
        copy:"aws sns create-topic --name my-topic",
        help:`주제 하나에 큐·이메일·Lambda 를 동시에 붙여 팬아웃(fan-out)할 수 있습니다.` } },

    { title:"구독 생성(이메일)", needs:2,
      intro:`주제 상세 화면에서 ${term("구독 생성","Create subscription. 주제의 메시지를 받을 대상(엔드포인트)을 연결하는 화면")} 을 누릅니다. 프로토콜로 ${term("이메일","Email. 지정한 주소로 알림을 보내는 전송 방식. 수신자가 확인 링크를 눌러야 활성화됨")} 을 고르고, 엔드포인트 주소는 미리 채워져 있어요. 프로토콜을 선택하고 구독 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>구독 생성</h4><p class="sub">주제 ARN: arn:aws:sns:...:my-topic</p><div class="opt ck" data-key="email"><span class="rd"></span><div><div class="nm">이메일 (Email)</div><div class="ds">지정 주소로 알림 발송</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">Amazon SQS</div><div class="ds">큐로 전달</div></div></div><div class="field"><label>엔드포인트</label><div class="input prefilled">ops@example.com <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="sub">구독 생성</button></div></div>`,
      cli:{ note:`CLI 로 구독을 걸면 확인 메일이 발송됩니다.`,
        lines:[ {cmt:"# 이메일 구독 추가"}, {p:"$",cmd:` aws sns `,flagHtml:flag("subscribe","주제에 구독 추가")}, {out:"확인 대기: ops@example.com"} ],
        copy:"aws sns subscribe --topic-arn arn:aws:sns:ap-northeast-2:...:my-topic --protocol email --notification-endpoint ops@example.com",
        help:`이메일 구독은 수신자가 메일의 확인(Confirm) 링크를 눌러야 활성화됩니다.` } },

    { title:"EventBridge 규칙 생성", needs:2,
      intro:`마지막으로 ${term("EventBridge","발생한 이벤트를 조건(이벤트 패턴)이나 일정에 맞게 원하는 대상으로 자동 라우팅하는 서비스")} 에서 ${term("규칙 생성","Create rule. 어떤 이벤트를 어디로 보낼지 정의하는 규칙을 만드는 화면")} 을 누릅니다. 실시간 대용량 스트림은 ${term("Kinesis","끊임없이 들어오는 데이터를 실시간으로 받아 처리하는 스트리밍 서비스")} 로 다루지만, 이벤트 분배에는 EventBridge 가 편해요. 규칙 유형으로 이벤트 패턴을 고르고 규칙 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>규칙 생성</h4><p class="sub">이벤트 버스: default · 대상: SNS my-topic</p><div class="opt ck" data-key="pattern"><span class="rd"></span><div><div class="nm">이벤트 패턴이 있는 규칙</div><div class="ds">source: orders / detail-type: created</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">일정</div><div class="ds">주기적으로 트리거</div></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">규칙 생성</button></div></div>`,
      cli:{ note:`규칙을 만들고 SNS 주제를 대상으로 붙입니다.`,
        lines:[ {cmt:"# 이벤트 패턴 규칙 생성"}, {p:"$",cmd:` aws events `,flagHtml:flag("put-rule","EventBridge 규칙 생성")}, {out:"RuleArn: arn:aws:events:...:rule/order-created-rule"} ],
        copy:"aws events put-rule --name order-created-rule --event-pattern {\"source\":[\"orders\"],\"detail-type\":[\"created\"]}",
        help:`규칙을 만든 뒤 put-targets 로 SNS 주제를 대상으로 연결하면 이벤트가 주제로 흘러갑니다.` } },

    { title:"완료", finish:true,
      intro:`축하합니다! 큐·주제·구독·이벤트 규칙까지 연결해, 서비스끼리 직접 붙지 않고 메시지로 느슨하게 통신하는 구조를 만들었어요. 확인 버튼으로 마무리하세요.`,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ 메시징 파이프라인 완성</h4><div class="rowsum"><span class="k">SQS 큐</span><span class="v">my-queue (표준)</span></div><div class="rowsum"><span class="k">SNS 주제</span><span class="v">my-topic (표준)</span></div><div class="rowsum"><span class="k">구독</span><span class="v">email · ops@example.com</span></div><div class="rowsum"><span class="k">규칙</span><span class="v">order-created-rule → my-topic</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">실습 마치기</button></div></div>`,
      cli:{ note:`규칙에 연결된 대상을 확인합니다.`,
        lines:[ {cmt:"# 규칙의 대상 조회"}, {p:"$",cmd:` aws events `,flagHtml:flag("list-targets-by-rule","규칙에 연결된 대상 조회")}, {out:"Target: my-topic (SNS)"} ],
        copy:"aws events list-targets-by-rule --rule order-created-rule",
        help:`끝! 이제 주문 이벤트 → EventBridge → SNS → 구독자 순으로 메시지가 자동으로 흐릅니다.` } }
  ]
},
{
  id:"security", ch:14, icon:"🔑", name:"KMS·Secrets", label:"챕터 14 · 보안 — KMS 키 생성·자동 교체 + Secrets Manager", doneMsg:"KMS 대칭 키를 만들어 자동 키 교체를 켜고, RDS 자격 증명을 Secrets Manager에 저장했습니다. 코드에 비밀번호를 직접 적지 않는 게 핵심이에요.",
  steps:[
    {
      title:"KMS 키 생성 — 키 유형 고르기",
      needs:2,
      intro:`먼저 ${term("KMS","AWS Key Management Service. 암호화 키를 안전하게 만들고 보관·관리하는 서비스")} 콘솔에서 키 생성(Create key)을 시작합니다. 키 구성 화면에서 키 유형은 대부분의 데이터 암호화에 쓰는 대칭(Symmetric)을 고르고, 키 사용은 암호화 및 암호 해독으로 둔 채 다음(Next)을 누르세요.`,
      console:`<div class="scr"><h4>키 구성 (Configure key)</h4><p class="sub">키 유형과 키 사용 방식을 정합니다</p><div class="field"><label>키 유형 (Key type)</label><div class="input prefilled">대칭 (Symmetric) 선택 예정 <span class="tag">안내</span></div></div><div class="opt ck" data-key="sym"><span class="rd"></span><div><div class="nm">대칭 (Symmetric)</div><div class="ds">하나의 키로 암호화·복호화 · 가장 일반적</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">비대칭 (Asymmetric)</div><div class="ds">서명·공개키 교환용</div></div></div><div class="rowsum"><span class="k">키 사용 (Key usage)</span><span class="v">암호화 및 암호 해독</span></div><div class="btnrow"><button class="btn primary ck" data-key="next">다음 (Next)</button></div></div>`,
      cli:{ note:`CLI에서는 보유 키 목록부터 확인합니다.`, lines:[ {cmt:"# 키 목록 조회"}, {p:"$",cmd:` aws kms `,flagHtml:flag("list-keys","KMS 키 목록 조회")}, {out:"Keys: [] (아직 없음)"} ], copy:"aws kms list-keys", help:`${term("엔벨로프 암호화","데이터는 데이터 키로 암호화하고, 그 데이터 키를 다시 KMS 키로 암호화하는 2단계 방식")} 덕분에 대용량 데이터도 빠르고 안전하게 암호화합니다.` }
    },
    {
      title:"별칭 지정 · 권한 · 키 생성",
      needs:1,
      intro:`레이블 추가(Add labels) 화면에서 별칭(Alias)은 my-app-key로 미리 채워 두었습니다. 키 관리 권한과 키 사용 권한은 기본값 그대로 두고, 검토(Review) 후 완료(Finish)를 눌러 키를 생성하세요.`,
      console:`<div class="scr"><h4>레이블 추가 · 검토 (Add labels · Review)</h4><p class="sub">별칭을 정하고 키를 생성합니다</p><div class="field"><label>별칭 (Alias)</label><div class="input prefilled">my-app-key <span class="tag">입력됨</span></div></div><div class="rowsum"><span class="k">키 관리 권한</span><span class="v">기본 (현재 계정)</span></div><div class="rowsum"><span class="k">키 사용 권한</span><span class="v">기본</span></div><div class="btnrow"><button class="btn primary ck" data-key="finish">완료 (Finish)</button></div></div>`,
      cli:{ note:`CLI로 키를 만들고 별칭을 붙입니다.`, lines:[ {cmt:"# 대칭 키 생성"}, {p:"$",cmd:` aws kms `,flagHtml:flag("create-key","암호화 키 생성")}, {out:"KeyId: 1234abcd-..."}, {cmt:"# 별칭 연결"}, {p:"$",cmd:` aws kms `,flagHtml:flag("create-alias","키에 별칭 부여")}, {out:"alias/my-app-key → 1234abcd-..."} ], copy:"aws kms create-key --description my-app-key", help:`별칭을 쓰면 긴 KeyId 대신 사람이 읽기 쉬운 이름으로 키를 참조할 수 있습니다.` }
    },
    {
      title:"자동 키 교체 켜기",
      needs:2,
      intro:`방금 만든 키의 상세 화면에서 키 교체(Key rotation) 설정을 엽니다. ${term("자동 키 교체","키 머티리얼을 주기적으로 새것으로 교체해 유출 위험을 줄이는 기능")}를 체크해 매년 자동으로 교체되도록 켠 뒤 저장하세요.`,
      console:`<div class="scr"><h4>키 교체 (Key rotation)</h4><p class="sub">my-app-key · 자동 교체를 설정합니다</p><div class="opt ck" data-key="rotate"><span class="ck-box"></span><div><div class="nm">자동 키 교체 사용 (매년)</div><div class="ds">Automatically rotate this KMS key every year</div></div></div><div class="btnrow"><button class="btn primary ck" data-key="save">저장 (Save)</button></div></div>`,
      cli:{ note:`CLI로 자동 로테이션을 켭니다.`, lines:[ {cmt:"# 자동 키 교체 활성화"}, {p:"$",cmd:` aws kms `,flagHtml:flag("enable-key-rotation","키 자동 교체 활성화")}, {out:"로테이션 활성화됨"} ], copy:"aws kms enable-key-rotation --key-id alias/my-app-key", help:`로테이션을 켜도 과거 데이터는 예전 키 버전으로 그대로 복호화되니 걱정 없습니다.` }
    },
    {
      title:"Secrets Manager — 새 보안 암호 저장",
      needs:2,
      intro:`이제 ${term("Secrets Manager","DB 비밀번호 같은 비밀값을 안전하게 저장하고 자동으로 교체해 주는 서비스")}에서 새 보안 암호 저장(Store a new secret)을 시작합니다. 보안 암호 유형으로 Amazon RDS의 자격 증명을 고르면 사용자명·비밀번호 칸이 나옵니다(미리 채워 둠). 다음을 누르세요.`,
      console:`<div class="scr"><h4>보안 암호 유형 선택 (Choose secret type)</h4><p class="sub">저장할 비밀의 종류를 고릅니다</p><div class="opt ck" data-key="rds"><span class="rd"></span><div><div class="nm">Amazon RDS의 자격 증명</div><div class="ds">Credentials for Amazon RDS database</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">기타 유형의 보안 암호</div><div class="ds">Other type of secret (API 키 등)</div></div></div><div class="field"><label>사용자 이름 / 비밀번호</label><div class="input prefilled">admin / •••••••••• <span class="tag">입력됨</span></div></div><div class="rowsum"><span class="k">암호화 키</span><span class="v">alias/my-app-key</span></div><div class="btnrow"><button class="btn primary ck" data-key="next">다음 (Next)</button></div></div>`,
      cli:{ note:`저장된 비밀 목록을 먼저 확인합니다.`, lines:[ {cmt:"# 비밀 목록 조회"}, {p:"$",cmd:` aws secretsmanager `,flagHtml:flag("list-secrets","저장된 비밀 목록 조회")}, {out:"SecretList: [] (아직 없음)"} ], copy:"aws secretsmanager list-secrets", help:`비밀번호를 코드나 설정 파일에 적는 대신 여기에 맡기면, 앱은 실행 시점에 꺼내 쓰므로 코드에 비밀이 남지 않습니다.` }
    },
    {
      title:"보안 암호 이름 지정 · 저장 · 완료",
      needs:1,
      finish:true,
      intro:`보안 암호 구성(Configure secret) 화면에서 보안 암호 이름을 prod/db/password로 미리 채워 두었습니다. 저장(Store)을 눌러 마무리하세요. 참고로 웹 공격 차단은 ${term("WAF","악성 웹 요청을 규칙으로 걸러 내는 웹 방화벽")}, 대규모 DDoS 방어는 ${term("Shield","대규모 DDoS 공격을 막아 주는 서비스")}, 계정 이상 행위 탐지는 ${term("GuardDuty","계정의 이상 행위를 자동으로 탐지하는 위협 탐지 서비스")}, S3 민감정보 탐지는 ${term("Macie","S3에 저장된 개인정보 등 민감 데이터를 찾아 주는 서비스")}가 맡습니다.`,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">보안 암호 구성 (Configure secret)</h4><p class="sub">KMS 키로 암호화되어 보관됩니다</p><div class="field"><label>보안 암호 이름 (Secret name)</label><div class="input prefilled">prod/db/password <span class="tag">입력됨</span></div></div><div class="rowsum"><span class="k">암호화 키</span><span class="v">alias/my-app-key</span></div><div class="btnrow"><button class="btn primary ck" data-key="store">저장 (Store)</button></div></div>`,
      cli:{ note:`CLI로 비밀을 저장합니다.`, lines:[ {cmt:"# RDS 비밀번호 저장"}, {p:"$",cmd:` aws secretsmanager `,flagHtml:flag("create-secret","새 비밀 생성·저장")}, {out:"ARN: arn:aws:secretsmanager:...:prod/db/password"} ], copy:"aws secretsmanager create-secret --name prod/db/password --secret-string s3cr3t --kms-key-id alias/my-app-key", help:`끝! KMS 키 생성·자동 교체·비밀 저장이 한 번에 자리 잡았습니다. 필요한 역할에만 읽기 권한을 주는 게 보안의 기본입니다.` }
    }
  ]
},
{
  id:"observ", ch:15, icon:"📈", name:"CloudWatch", label:"챕터 15 · 운영·관측 — CloudWatch 경보로 지표 감시", doneMsg:"CPU 사용률 지표에 정적 임계값 경보를 만들고 SNS 알림까지 연결했습니다. CloudTrail 추적으로 누가 무엇을 했는지도 남겼어요. 관측은 지표·로그·추적 세 가지를 함께 봐야 합니다.",
  steps:[
    {
      title:"경보 생성 — 지표 선택",
      needs:1,
      intro:`${term("CloudWatch","지표·로그·경보·대시보드로 리소스 상태를 관측하는 모니터링 서비스")} 콘솔에서 경보(Alarms) > 경보 생성(Create alarm)을 누른 뒤, 지표 선택(Select metric)에서 찾아봅니다. EC2 > 인스턴스별 지표(Per-Instance Metrics)로 들어가 CPUUtilization 지표를 고르세요.`,
      console:`<div class="scr"><h4>지표 선택 (Select metric)</h4><p class="sub">EC2 › 인스턴스별 지표 (Per-Instance Metrics)</p><div class="rowsum"><span class="k">네임스페이스</span><span class="v">AWS/EC2</span></div><div class="opt ck" data-key="cpu"><span class="ck-box"></span><div><div class="nm">CPUUtilization</div><div class="ds">i-0ab12cd · CPU 사용률(%)</div></div></div><div class="opt locked"><span class="ck-box"></span><div><div class="nm">NetworkIn</div><div class="ds">수신 네트워크 바이트</div></div></div></div>`,
      cli:{ note:`CLI에서는 사용 가능한 지표를 나열합니다.`, lines:[ {cmt:"# EC2 지표 목록 조회"}, {p:"$",cmd:` aws cloudwatch `,flagHtml:flag("list-metrics","수집 중인 지표 목록 조회")}, {out:"Metric: CPUUtilization (AWS/EC2)"} ], copy:"aws cloudwatch list-metrics --namespace AWS/EC2", help:`${term("지표","Metric. 시간에 따라 수집되는 숫자 측정값으로, 경보·대시보드의 재료가 됩니다")}는 네임스페이스·차원(인스턴스 ID 등)으로 구분됩니다.` }
    },
    {
      title:"조건 설정 — 정적 임계값",
      needs:2,
      intro:`조건(Conditions)에서 임계값 유형(Threshold type)을 정적(Static)으로 두고, 조건을 보다 큼(Greater)으로 고른 뒤 임계값 80을 그대로 둡니다. CPU가 80%를 넘으면 경보 상태가 되도록 설정하는 거예요. 다음(Next)을 누르세요.`,
      console:`<div class="scr"><h4>조건 (Conditions)</h4><p class="sub">언제 경보 상태로 바꿀지 정합니다</p><div class="opt ck" data-key="static"><span class="rd"></span><div><div class="nm">정적 (Static)</div><div class="ds">고정 임계값과 비교</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">이상 탐지 (Anomaly detection)</div><div class="ds">학습된 정상 범위와 비교</div></div></div><div class="rowsum"><span class="k">조건</span><span class="v">보다 큼 (Greater >)</span></div><div class="field"><label>임계값 (Threshold)</label><div class="input prefilled">80 <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="next">다음 (Next)</button></div></div>`,
      cli:{ note:`CLI에서는 비교 연산자와 임계값을 플래그로 넘깁니다.`, lines:[ {cmt:"# 비교 조건 미리보기"}, {p:"$",cmd:` aws cloudwatch `,flagHtml:flag("put-metric-alarm","경보 생성/갱신 (조건 포함)")}, {out:"ComparisonOperator: GreaterThanThreshold / Threshold: 80"} ], copy:"aws cloudwatch put-metric-alarm --alarm-name cpu-high --comparison-operator GreaterThanThreshold --threshold 80 --evaluation-periods 2", help:`평가 기간(Period)과 연속 횟수(Datapoints)를 함께 정해야, 잠깐 튀는 값에 경보가 울리지 않습니다.` }
    },
    {
      title:"작업 구성 — SNS 알림 연결",
      needs:2,
      intro:`작업 구성(Configure actions)에서 경보 상태(In alarm)가 될 때 ${term("SNS","하나의 알림을 구독한 여러 대상에게 뿌리는 발행/구독 서비스")} 주제로 알림을 보내도록 체크하고, 받을 주제를 고릅니다. 그다음 경보 이름을 cpu-high로 두고 경보 생성(Create alarm)을 누르세요.`,
      console:`<div class="scr"><h4>작업 구성 (Configure actions)</h4><p class="sub">경보 상태일 때 할 일을 정합니다</p><div class="opt ck" data-key="notify"><span class="ck-box"></span><div><div class="nm">SNS 주제로 알림 (경보 상태 In alarm)</div><div class="ds">Send a notification to an SNS topic</div></div></div><div class="opt ck" data-key="topic"><span class="rd"></span><div><div class="nm">기존 주제 선택: ops-alerts</div><div class="ds">알림 수신 주제</div></div></div><div class="field"><label>경보 이름 (Alarm name)</label><div class="input prefilled">cpu-high <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">경보 생성 (Create alarm)</button></div></div>`,
      cli:{ note:`CLI에서는 --alarm-actions로 SNS ARN을 연결합니다.`, lines:[ {cmt:"# SNS 주제를 경보 작업으로 연결"}, {p:"$",cmd:` aws cloudwatch `,flagHtml:flag("put-metric-alarm","경보 생성 + 작업(SNS) 연결")}, {out:"AlarmActions: [arn:aws:sns:...:ops-alerts]"} ], copy:"aws cloudwatch put-metric-alarm --alarm-name cpu-high --alarm-actions arn:aws:sns:ap-northeast-2:...:ops-alerts", help:`${term("경보","Alarm. 지표가 조건을 벗어나면 상태를 바꾸고 알림·자동 조치를 트리거하는 감시 장치")}는 OK·경보·데이터 부족 세 가지 상태를 오갑니다.` }
    },
    {
      title:"CloudTrail 추적 생성 · 완료",
      needs:2,
      finish:true,
      intro:`끝으로 ${term("CloudTrail","누가 언제 어떤 API를 호출했는지 전부 기록하는 감사 로그 서비스")}에서 추적 생성(Create trail)을 합니다. 추적 이름과 저장할 S3 버킷을 미리 채워 두었어요. 생성을 누르면 마무리됩니다. 요청 단위 추적은 ${term("X-Ray","요청이 여러 서비스를 거치는 경로와 지연을 추적하는 분산 추적 서비스")}, 구성 변경 추적은 ${term("Config","리소스 설정 변경 이력을 기록하고 규정 준수를 평가하는 서비스")}, 원격 운영은 ${term("Systems Manager","서버 접속 없이 패치·명령·파라미터를 관리하는 운영 서비스")}가 맡습니다.`,

let saved={};
try{ saved=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ saved={}; }
scenarios.forEach((s,i)=>{ s.steps.forEach((st,j)=>{ st.done = !!(saved[i]&&saved[i][j]); st._clicks=new Set(); }); });
function persist(){
  const m={}; scenarios.forEach((s,i)=>{ m[i]={}; s.steps.forEach((st,j)=>{ if(st.done) m[i][j]=1; }); });
  try{ localStorage.setItem(KEY,JSON.stringify(m)); }catch(e){}
}

/* ---------- 요소 ---------- */
const $=id=>document.getElementById(id);
const tip=$("tip");

/* ---------- 렌더 ---------- */
function renderScenarioPicker(){
  const sel=$("scsel");
  sel.innerHTML = scenarios.map((s,i)=>{
    const all=s.steps.every(x=>x.done);
    return `<option value="${i}" ${i===si?'selected':''}>${s.icon} 챕터 ${s.ch}. ${s.name}${all?'  ✓':''}</option>`;
  }).join("");
  sel.onchange=()=>{ si=+sel.value; sti=0; render(); };
}
function renderSteps(){
  const s=scenarios[si];
  $("sctitle").textContent=s.label;
  $("steplist").innerHTML = s.steps.map((st,j)=>
    `<li data-j="${j}" aria-current="${j===sti}" class="${st.done?'done':''}">
      <span class="badge">${st.done?'✓':(j+1)}</span><span>${st.title}</span></li>`).join("");
  $("steplist").querySelectorAll("li").forEach(li=>li.onclick=()=>{ sti=+li.dataset.j; render(); });
}
function cliHTML(cli){
  const lines = cli.lines.map(l=>{
    if(l.cmt) return `<span class="line cmt">${l.cmt}</span>`;
    if(l.out!==undefined && !l.flagHtml && !l.cmd) return `<span class="line out">${l.out}</span>`;
    let s="";
    if(l.p) s+=`<span class="p">${l.p}</span>`;
    if(l.out!==undefined) s+=`<span class="out">${l.out}</span>`;
    if(l.cmd) s+=`<span class="cmd">${l.cmd}</span>`;
    if(l.flagHtml) s+=l.flagHtml;
    return `<span class="line">${s}</span>`;
  }).join("");
  return `<div class="note-sm">${cli.note}</div>
    <div class="term">${lines}</div>
    <div class="copyrow"><span style="font-size:12px;color:var(--muted)">실제로 쓸 땐 이 명령을 터미널에</span>
      <button class="copybtn" data-cmd="${cli.copy.replace(/"/g,'&quot;')}">⧉ 명령 복사</button></div>
    <div class="clihelp">${cli.help}</div>`;
}
function render(){
  const s=scenarios[si], st=s.steps[sti];
  $("crumb").textContent = s.name + " › " + st.title;
  renderScenarioPicker(); renderSteps();
  $("kicker").textContent = `챕터 ${s.ch} · 단계 ${sti+1} / ${s.steps.length}`;
  $("stitle").textContent = st.title;
  $("sintro").innerHTML = st.intro;
  $("console").innerHTML = `<div class="bcrumb">콘솔 홈 <i>›</i> ${s.name} <i>›</i> <b>${st.title}</b></div>` + st.console;
  $("cli").innerHTML = cliHTML(st.cli);

  // 이미 끝낸 단계면 클릭 잠금 해제 상태로 표시
  if(st.done){ $("console").querySelectorAll(".ck").forEach(e=>e.classList.add("on")); }

  // 클릭 대상이 없는 단계(순수 완료/확인 화면)는 자동 완료 처리
  if($("console").querySelectorAll(".ck").length===0 && !st.done){ st.done=true; persist(); }
  attachClicks();
  attachCopy();
  updateHint();
  updateNav();
  bindTips();
  window.scrollTo({top:0,behavior:"smooth"});
}

function attachClicks(){
  const st=scenarios[si].steps[sti];
  $("console").querySelectorAll(".ck").forEach(el=>{
    el.setAttribute("tabindex","0");
    el.setAttribute("role","button");
    const act=()=>{
      if(st.done){ return; }
      const k=el.dataset.key;
      el.classList.add("on");
      st._clicks.add(k);
      const need = st.needs||1;
      if(st._clicks.size>=need){
        st.done=true; persist();
        $("console").querySelectorAll(".ck").forEach(e=>e.classList.add("on"));
      }
      updateHint(); updateNav(); renderSteps();
    };
    el.onclick=act;
    el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } };
  });
}
function attachCopy(){
  const b=$("cli").querySelector(".copybtn");
  if(!b) return;
  b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(b.dataset.cmd); b.classList.add("copied"); b.textContent="✓ 복사됨";
      setTimeout(()=>{ b.classList.remove("copied"); b.textContent="⧉ 명령 복사"; },1500);
    }catch(e){ b.textContent="복사 실패 — 길게 눌러 선택"; }
  };
}
function updateHint(){
  const st=scenarios[si].steps[sti];
  let box=$("console").querySelector(".hint");
  if(!box){ box=document.createElement("div"); box.className="hint"; $("console").appendChild(box); }
  if(st.done){ box.className="hint ok"; box.innerHTML="✓ 잘했어요! 아래 <b>다음 →</b>으로 넘어가세요."; }
  else{
    const need=st.needs||1, got=st._clicks.size;
    box.className="hint todo";
    box.innerHTML = need>1 ? `👆 반짝이는 항목을 <b>${need}개 모두</b> 클릭하세요 (${got}/${need})`
                           : "👆 반짝이는 <b>주황색 버튼/항목</b>을 클릭하세요.";
  }
}
function updateNav(){
  const s=scenarios[si], st=s.steps[sti];
  $("prev").disabled = (sti===0);
  const last = (sti===s.steps.length-1);
  const nx=$("next");
  nx.disabled = !st.done;
  nx.textContent = last ? "실습 완료 🎉" : "다음 →";
  nx.classList.toggle("go", true);
  const totalDone = s.steps.filter(x=>x.done).length;
  const pct = Math.round(totalDone/s.steps.length*100);
  $("barfill").style.width = pct+"%";
  $("pct").textContent = pct+"% 완료";
}
$("prev").onclick=()=>{ if(sti>0){ sti--; render(); } };
$("next").onclick=()=>{
  const s=scenarios[si];
  if(sti < s.steps.length-1){ sti++; render(); }
  else { showDone(); }
};

/* ---------- 완료 오버레이 ---------- */
function showDone(){
  const s=scenarios[si];
  $("donemsg").textContent = s.doneMsg;
  const other = (si+1)%scenarios.length;
  $("donebtns").innerHTML =
    `<button class="pri" id="d-other">${scenarios[other].icon} 챕터 ${scenarios[other].ch} ‘${scenarios[other].name}’ 해보기</button>
     <button id="d-review">이 실습 다시 보기</button>
     <button id="d-close">닫기</button>`;
  $("done").classList.add("show");
  $("d-other").onclick=()=>{ si=other; sti=0; $("done").classList.remove("show"); render(); };
  $("d-review").onclick=()=>{ sti=0; $("done").classList.remove("show"); render(); };
  $("d-close").onclick=()=>{ $("done").classList.remove("show"); };
}
$("done").onclick=e=>{ if(e.target===$("done")) $("done").classList.remove("show"); };

/* ---------- 툴팁 ---------- */
let tipT=null;
function showTip(el){
  const txt=el.getAttribute("data-tip"); if(!txt) return;
  tip.innerHTML=txt; tip.classList.add("show");
  const r=el.getBoundingClientRect();
  const tw=Math.min(270, tip.offsetWidth), th=tip.offsetHeight;
  let top=r.top-th-10, pos="top";
  if(top<8){ top=r.bottom+10; pos="bottom"; }
  let left=r.left+r.width/2-tw/2;
  left=Math.max(8,Math.min(left,window.innerWidth-tw-8));
  tip.style.top=top+"px"; tip.style.left=left+"px"; tip.dataset.pos=pos;
  const ax=r.left+r.width/2-left; tip.style.setProperty("--ax",ax+"px");
}
function hideTip(){ tip.classList.remove("show"); }
function bindTips(){
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.onmouseenter=()=>showTip(el);
    el.onmouseleave=()=>{ if(!el.classList.contains("ck")) hideTip(); };
    el.onfocus=()=>showTip(el); el.onblur=hideTip;
    if(!el.classList.contains("ck")){
      el.onclick=(e)=>{ e.stopPropagation(); if(tip.classList.contains("show")&&tip._for===el){ hideTip(); } else { showTip(el); tip._for=el; } };
    }
  });
}
document.addEventListener("click",e=>{ if(!e.target.closest("[data-tip]")) hideTip(); });
window.addEventListener("scroll",hideTip,true);
window.addEventListener("resize",hideTip);

/* ---------- 테마 ---------- */
$("theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : (cur==="light" ? "dark" : (matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("aws-handson-theme",next); }catch(e){}
};
try{ const t=localStorage.getItem("aws-handson-theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}

render();
</script>
</body>
</html>
