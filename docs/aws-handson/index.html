<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AWS 클릭 실습실</title>
<meta name="description" content="실제 AWS에 접속하지 않고 클릭만으로 따라 하는 초심자용 AWS 실습 시뮬레이터. 콘솔(UI) 방식과 CLI 명령어 방식을 나란히, 용어마다 툴팁 설명." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* 레이아웃: 상단 AWS 바 + (사이드바 단계목록 | 본문: 콘솔 pane + CLI pane) */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface2:#fafbfc;
  --ink:#16191f; --muted:#5f6b7a; --line:#d5dbdb; --line2:#e9ebed;
  --navy:#232f3e; --navy2:#1a2634;
  --accent:#ec7211; --accent-h:#d85c04; --accent-soft:#fdefe3;
  --link:#0073bb; --link-soft:#eef5fc; --ok:#1d8102; --ok-soft:#eaf5e6; --warn:#8a6d1f; --warn-soft:#fbf3da; --danger:#d13212; --danger-soft:#fdecea;
  --term-bg:#152230; --term-ink:#e6edf3; --term-dim:#8aa0b4; --term-green:#7ee787; --term-orange:#ffbf7a;
  --radius:10px; --shadow:0 1px 2px rgba(16,25,40,.08),0 6px 20px rgba(16,25,40,.06);
  --disp:"Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --surface:#15202e; --surface2:#1a2736;
    --ink:#e8edf2; --muted:#9fb0c0; --line:#2b3a4d; --line2:#223042;
    --navy:#0b141f; --navy2:#060d15;
    --accent:#ff8c2e; --accent-h:#ffa24f; --accent-soft:#3a2614;
    --link:#4aa8e0; --link-soft:#13273a; --ok:#5fc74a; --ok-soft:#1c3119; --warn:#e0b84a; --warn-soft:#352c12; --danger:#ff6b4a; --danger-soft:#3a1c15;
    --term-bg:#0a121c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --surface:#15202e; --surface2:#1a2736;
  --ink:#e8edf2; --muted:#9fb0c0; --line:#2b3a4d; --line2:#223042;
  --navy:#0b141f; --navy2:#060d15;
  --accent:#ff8c2e; --accent-h:#ffa24f; --accent-soft:#3a2614;
  --link:#4aa8e0; --ok:#5fc74a; --ok-soft:#1c3119; --warn:#e0b84a; --warn-soft:#352c12; --danger:#ff6b4a; --danger-soft:#3a1c15;
  --term-bg:#0a121c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;line-height:1.3}
button{font-family:inherit}
a{color:var(--link)}

/* 상단 바 */
.awsbar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:0 14px;height:48px;position:sticky;top:0;z-index:30}
.awsbar .logo{display:flex;align-items:baseline;gap:7px;font-weight:700;font-size:15px}
.awsbar .logo .cube{color:#fff;background:var(--accent);font-weight:800;font-size:13px;letter-spacing:.5px;padding:2px 6px;border-radius:4px}
.awsbar .logo .sfx{color:#c5cdd6;font-weight:600;font-size:13px}
.awsbar .tnav{color:#dbe2ea;font-size:13px;padding:0 2px;white-space:nowrap}
.awsbar .gsearch{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:6px 11px;color:#aeb9c5;font-size:12.5px;min-width:0}
.awsbar .gsearch .gi{opacity:.8}
.awsbar .crumb{display:none}
.awsbar .spacer{display:none}
.awsbar .pill{background:#2e3c4e;color:#dbe2ea;border-radius:6px;padding:5px 9px;font-size:12.5px;white-space:nowrap}
.awsbar .pill.region{cursor:default}
.themebtn{background:#2e3c4e;color:#dbe2ea;border:0;border-radius:6px;padding:6px 9px;font-size:13px;cursor:pointer}
.themebtn:hover{background:#3a4a5e}

/* 안내 배너 */
.note{
  background:var(--accent-soft);border-bottom:1px solid var(--line);
  color:var(--ink);padding:9px 16px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center
}
.note b{color:var(--accent-h)}
.note .dot{color:var(--muted)}

/* 전체 셸 */
.shell{display:grid;grid-template-columns:260px 1fr;gap:0;align-items:start}
@media (max-width:860px){.shell{grid-template-columns:1fr}}

/* 사이드바 */
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  min-height:calc(100vh - 48px);padding:16px 12px 40px;position:sticky;top:48px
}
@media (max-width:860px){.sidebar{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line)}}
.scsel{width:100%;margin-bottom:14px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.scsel:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sctitle{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 6px 8px}
.steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steplist li{
  display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px
}
.steplist li:hover{background:var(--surface2)}
.steplist li[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.steplist li.done{color:var(--ink)}
.steplist .badge{
  flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);margin-top:1px
}
.steplist li[aria-current="true"] .badge{border-color:var(--accent);color:var(--accent-h)}
.steplist li.done .badge{background:var(--ok);border-color:var(--ok);color:#fff}

/* 본문 */
.stage{padding:22px clamp(16px,4vw,34px) 60px;max-width:1120px}
.stephead{margin-bottom:16px}
.stephead .kicker{font-size:12.5px;color:var(--accent-h);font-weight:700;letter-spacing:.04em}
.stephead h2{font-size:clamp(20px,3vw,25px);margin:3px 0 6px}
.stephead p{margin:0;color:var(--muted);max-width:66ch}

.panes{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (max-width:980px){.panes{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pane>.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);font-weight:700;font-size:13.5px}
.pane.console>.ph{display:none}
.pane.cli{box-shadow:none}
.pane.cli>.ph{background:var(--navy);color:#fff;border-bottom-color:var(--navy2);font-size:12.5px;font-weight:600}
.pane .body{padding:14px}
.pane.console{border:0;background:transparent;box-shadow:none;border-radius:0;overflow:visible}
.pane.console .body{padding:0}
/* 콘솔 콘텐츠를 AWS 본문처럼: 패널들이 직접 놓임 */
.pane.console .scr:first-of-type{margin-top:0}
.bcrumb{font-size:12px;color:var(--muted);margin:0 0 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bcrumb b{color:var(--ink);font-weight:600}
.bcrumb i{opacity:.5;font-style:normal}

/* 가짜 콘솔 요소 */
.scr{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.scr + .scr{margin-top:12px}
.scr h4{font-size:15px;margin:-16px -16px 12px;padding:11px 16px;border-bottom:1px solid var(--line2);background:var(--surface2);border-radius:8px 8px 0 0;font-family:var(--disp)}
.scr .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.field{margin:9px 0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.input{
  background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:13.5px;color:var(--ink);
  display:flex;align-items:center;gap:8px;min-height:38px
}
.input.prefilled{color:var(--ink)}
.input .tag{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.dots{letter-spacing:3px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc{display:flex;gap:9px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px}
.svc .sic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;flex:none}
.svc .nm{font-size:13px;font-weight:600}
.svc .ds{font-size:11.5px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin:7px 0}
.opt .rd{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.opt .ck-box{width:17px;height:17px;border-radius:4px;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;color:#fff;font-size:11px}
.opt .nm{font-weight:600;font-size:13.5px}
.opt .ds{font-size:12px;color:var(--muted)}
.opt .free{margin-left:auto;font-size:11px;color:var(--ok);background:var(--ok-soft);border-radius:5px;padding:1px 7px;white-space:nowrap;align-self:center}
.rowsum{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.rowsum:last-child{border-bottom:0}
.rowsum .k{color:var(--muted)}
.rowsum .v{font-weight:600;text-align:right}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 11px;font-size:13px}
.chip .fi{color:var(--link)}

/* 클릭해야 하는 곳 */
.ck{cursor:pointer;position:relative;transition:border-color .12s,background .12s,box-shadow .12s}
.ck:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.opt{cursor:pointer}
.opt:not(.on):hover,.svc:not(.on):hover{border-color:var(--link)}
.opt.on,.svc.on{box-shadow:0 0 0 1px var(--link);border-color:var(--link)!important;background:var(--link-soft)!important}
.opt.on .rd{border-color:var(--link);background:radial-gradient(circle at center,var(--link) 0 5px,transparent 6px)}
.opt.on .ck-box{border-color:var(--link);background:var(--link)}
.ck.locked{opacity:.55;cursor:not-allowed}
/* 온디맨드 힌트: '어디를 클릭하죠?' 눌렀을 때만 */
body.hints .ck:not(.on):not(.locked){outline:2px dashed var(--accent);outline-offset:2px}
/* 틀린 선택 — 클릭하면 왜 틀렸는지 피드백(진짜 연습) */
.opt.wrong{cursor:pointer}
.opt.wrong:hover{border-color:var(--danger)}
.opt.wrong.flash{border-color:var(--danger)!important;background:var(--danger-soft)!important;animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint.bad{background:var(--danger-soft);color:var(--danger)}
@media (prefers-reduced-motion:reduce){.opt.wrong.flash{animation:none}}

/* 콘솔 버튼 */
.btn{border:0;border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* 성공 힌트 */
.hint{margin-top:12px;font-size:13px;border-radius:8px;padding:9px 12px;display:flex;gap:8px;align-items:flex-start}
.hint.todo{background:var(--accent-soft);color:var(--accent-h)}
.hint.ok{background:var(--ok-soft);color:var(--ok)}

/* 터미널(CLI) */
.cli .note-sm{padding:12px 14px 2px;font-size:12.5px;color:var(--muted)}
.term{background:var(--term-bg);margin:12px 14px 14px;border-radius:9px;padding:13px 14px;font-family:var(--mono);font-size:12.8px;line-height:1.75;color:var(--term-ink);overflow-x:auto}
.term .line{white-space:pre;display:block}
.term .p{color:var(--term-green)}
.term .cmd{color:var(--term-ink)}
.term .flag{color:var(--term-orange)}
.term .cmt{color:var(--term-dim)}
.term .out{color:var(--term-dim)}
.copyrow{display:flex;justify-content:space-between;align-items:center;padding:0 14px 14px}
.copybtn{background:var(--navy);color:#fff;border:1px solid var(--navy2);border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.copybtn:hover{background:var(--navy2)}
.copybtn.copied{background:var(--ok);border-color:var(--ok)}
.clihelp{padding:0 14px 16px;font-size:12px;color:var(--muted)}
.clihelp b{color:var(--ink)}

/* 용어 툴팁 트리거 */
.term-w{border-bottom:1.5px dotted var(--link);cursor:help;color:inherit}
.flag-w{border-bottom:1.5px dotted var(--term-orange);cursor:help}
.ii{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--link);color:#fff;font-size:10px;font-weight:700;cursor:help;vertical-align:middle;margin-left:2px}

/* 하단 내비 */
.navrow{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.navrow .bar{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.navrow .bar span{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.navrow .pct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.nbtn:disabled{opacity:.45;cursor:not-allowed}
.nbtn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.nbtn.go:disabled{background:var(--line);border-color:var(--line);color:var(--muted)}

/* 툴팁 */
#tip{
  position:fixed;z-index:60;max-width:min(270px,calc(100vw - 24px));background:var(--navy);color:#fff;
  padding:9px 12px;border-radius:9px;font-size:12.6px;line-height:1.55;box-shadow:0 8px 28px rgba(0,0,0,.28);
  opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .12s,transform .12s
}
#tip.show{opacity:1;transform:translateY(0)}
#tip b{color:var(--accent)}
#tip::after{content:"";position:absolute;width:10px;height:10px;background:var(--navy);transform:rotate(45deg)}
#tip[data-pos="top"]::after{bottom:-5px;left:var(--ax,50%);margin-left:-5px}
#tip[data-pos="bottom"]::after{top:-5px;left:var(--ax,50%);margin-left:-5px}

/* 완료 오버레이 */
#done{position:fixed;inset:0;z-index:80;background:rgba(10,16,24,.62);display:none;place-items:center;padding:20px}
#done.show{display:grid}
.donecard{background:var(--surface);border-radius:16px;max-width:440px;width:100%;padding:28px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.donecard .big{font-size:46px;line-height:1}
.donecard h2{font-size:22px;margin:12px 0 6px}
.donecard p{color:var(--muted);margin:0 0 18px;font-size:14px}
.donecard .dbtns{display:flex;gap:9px;flex-direction:column}
.donecard .dbtns button{border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.donecard .dbtns button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
/* ===== 실제 콘솔형 레이아웃 ===== */
.ribbon{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--accent-soft);border-bottom:1px solid var(--line);color:var(--ink);padding:7px 14px;font-size:12.5px}
.ribbon b{color:var(--accent-h)}
.ribbon .dot{color:var(--muted)}
.hintbtn{margin-left:4px;border:1px solid var(--accent);background:transparent;color:var(--accent-h);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer}
.hintbtn.on{background:var(--accent);color:#fff}
.realbtn{margin-left:2px;border:1px solid var(--ok);background:var(--ok);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.realbtn:hover{filter:brightness(1.08)}
.donecard .dbtns a.real{display:block;background:var(--ok);border:1px solid var(--ok);color:#fff;border-radius:9px;padding:11px;font-size:14px;font-weight:700;text-decoration:none}

.shell{grid-template-columns:240px 1fr}
.svcnav{background:var(--surface);border-right:1px solid var(--line);min-height:calc(100vh - 48px);position:sticky;top:48px;padding:0 0 30px}
.svc-h{font-weight:700;font-size:13.5px;padding:14px 16px 10px;border-bottom:1px solid var(--line2);color:var(--ink)}
.svc-list{list-style:none;margin:6px 0;padding:0}
.svc-list li{font-size:13px;color:var(--muted);padding:7px 16px 7px 15px;border-left:3px solid transparent}
.svc-list li.on{color:var(--ink);font-weight:600;background:var(--link-soft);border-left-color:var(--accent)}
.svc-foot{font-size:11px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line2);margin-top:6px;line-height:1.5}
.svc-foot b{color:var(--ink);font-weight:600}

.main{min-width:0}
.toolbar{display:flex;align-items:center;gap:10px;padding:9px clamp(14px,3vw,26px);border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.tlabel{font-size:12px;color:var(--muted);font-weight:600}
.toolbar .scsel{width:auto;min-width:220px;margin:0}
.stepchips{display:flex;gap:6px;margin-left:auto;overflow-x:auto;max-width:100%}
.chipstep{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.chipstep.cur{border-color:var(--accent);color:var(--accent-h);box-shadow:0 0 0 2px var(--accent-soft)}
.chipstep.done{background:var(--ok);border-color:var(--ok);color:#fff}

.content{padding:18px clamp(14px,3vw,26px) 54px;max-width:1040px}
.pagehdr{margin-bottom:10px}
.pagehdr .kicker{font-size:12px;color:var(--accent-h);font-weight:700;letter-spacing:.03em}
.pagehdr h1{font-size:clamp(20px,3vw,26px);margin:2px 0 0;font-family:var(--disp)}
.introbox{background:var(--link-soft);border:1px solid var(--line2);border-left:3px solid var(--link);border-radius:7px;padding:10px 13px;font-size:13px;color:var(--ink);margin-bottom:16px;line-height:1.6}
.introbox .term-w{border-bottom-color:var(--link)}
.muted2{color:var(--muted);font-weight:400}
/* 실제 콘솔처럼 한 페이지 폼 + 오른쪽 요약 */
.awsform{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}
.awsform .formcol{min-width:0;display:flex;flex-direction:column;gap:12px}
.awsform .summarycol{position:sticky;top:58px}
.summary h4{background:var(--surface2)}
.summary .btn.primary{width:100%;justify-content:center;margin-top:6px;padding:11px}
.sumnote{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
@media(max-width:900px){.awsform{grid-template-columns:1fr}.awsform .summarycol{position:static}}
.hint.todo{background:var(--surface2);color:var(--muted);border:1px solid var(--line2)}
.hint.ok{background:var(--ok-soft);color:var(--ok)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .svcnav{display:none}
  .toolbar .scsel{min-width:0;flex:1}
  .content{padding:14px 14px 48px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 모바일 최적화 ===== */
@media (max-width:860px){
  .sidebar{padding:12px 12px 14px}
  .scsel{margin-bottom:10px}
  .sctitle{margin:0 2px 6px}
  .steplist{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .steplist li{flex:none;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
  .steplist li span:not(.badge){display:none}
  .steplist li[aria-current="true"] span:not(.badge){display:inline;font-size:12px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panes{gap:12px}
}
@media (max-width:560px){
  body{overflow-x:hidden}
  .awsbar{gap:8px;padding:0 10px;height:46px}
  .awsbar .crumb{display:none}
  .awsbar .gsearch,.awsbar .tnav{display:none}
  .awsbar .pill.acct{display:none}
  .awsbar .logo{font-size:14px}
  .themebtn{padding:5px 8px}
  .note{font-size:12px;padding:8px 12px;gap:6px}
  .note .dot{display:none}
  .stage{padding:16px 16px 52px}
  .stephead h2{font-size:20px}
  .pane .body{padding:12px}
  .navrow{gap:10px}
  .navrow .bar{order:-1;flex-basis:100%}
  .nbtn{flex:1;padding:13px 10px;font-size:15px}
  #tip{font-size:13px}
}

<body>
<header class="awsbar">
  <span class="logo"><span class="cube">aws</span><span class="sfx">실습실</span></span>
  <span class="tnav">서비스 ▾</span>
  <div class="gsearch"><span class="gi">🔍</span> 서비스, 기능, 설명서 검색</div>
  <span class="crumb" id="crumb">콘솔 홈</span>
  <span class="spacer"></span>
  <button class="themebtn" id="theme" title="밝게/어둡게 전환">◐</button>
  <span class="pill region">🌐 서울 ▾</span>
  <span class="pill acct">연습-계정 ▾</span>
</header>

<div class="ribbon">
  <span>🧪 <b>실습 연습 공간</b> — 실제 AWS가 아니며 요금·위험이 없습니다. 실제처럼 선택하고 버튼을 눌러 진행하세요.</span>
  <span class="dot">·</span>
  <span><span class="term-w">점선 용어</span>는 올리거나 탭하면 설명.</span>
  <button class="hintbtn" id="hintbtn" type="button">어디를 클릭하죠?</button>
  <a class="realbtn" href="https://builder.aws.com/" target="_blank" rel="noopener">🚀 무료로 진짜 실습 ↗</a>
</div>

<div class="shell">
  <aside class="svcnav" id="svcnav"></aside>

  <main class="main">
    <div class="toolbar">
      <span class="tlabel">실습 선택</span>
      <select class="scsel" id="scsel" aria-label="실습 챕터 선택"></select>
      <div class="stepchips" id="stepchips"></div>
    </div>

    <div class="content">
      <div class="bcrumb" id="bcrumb"></div>
      <div class="pagehdr">
        <div class="kicker" id="kicker"></div>
        <h1 id="stitle"></h1>
      </div>
      <div class="introbox" id="sintro"></div>

      <div id="console"></div>

      <section class="pane cli">
        <div class="ph"><span class="ic">⌨️</span> 참고 · 같은 작업을 CLI 명령으로</div>
        <div id="cli"></div>
      </section>

      <div class="navrow">
        <button class="nbtn" id="prev">← 이전</button>
        <div class="bar"><span id="barfill"></span></div>
        <span class="pct" id="pct"></span>
        <button class="nbtn go" id="next" disabled>다음 →</button>
      </div>
    </div>
  </main>
</div>

<div id="tip" role="tooltip"></div>

<div id="done" role="dialog" aria-modal="true" aria-labelledby="donetitle">
  <div class="donecard">
    <div class="big">🎉</div>
    <h2 id="donetitle">실습 완료!</h2>
    <p id="donemsg"></p>
    <div class="dbtns" id="donebtns"></div>
  </div>
</div>

<script>
/* ---------- 데이터: 두 가지 실습 ---------- */
const T = {
  /* 재사용 툴팁 사전 */
};
function term(w, tip){ return `<span class="term-w" data-tip="${tip.replace(/"/g,'&quot;')}">${w}</span>`; }
function flag(w, tip){ return `<span class="flag-w flag" data-tip="${tip.replace(/"/g,'&quot;')}">${w}</span>`; }

const scenarios = [
{
  id:"iam", ch:1, icon:"🔐", name:"IAM 사용자·권한",
  label:"챕터 1 · 글로벌 인프라 & IAM — 사용자 생성·정책 연결",
  doneMsg:"작업용 IAM 사용자를 만들고 정책을 직접 연결했어요.",
  steps:[
    {
      title:"IAM 서비스 열기",
      intro:`AWS에서 ${term("IAM","Identity and Access Management. 누가 무엇을 할 수 있는지를 관리하는 서비스.")}는 권한을 다루는 곳이에요. 보안을 위해 ${term("루트 계정","가입할 때 만든 최고 권한 계정. 평소엔 쓰지 않고 작업용 사용자를 따로 만들어요.")} 대신 작업용 사용자를 만들어요. 콘솔 상단 검색창에 IAM이 들어가 있어요 — 아래 <b>IAM</b> 카드를 클릭하세요.`,
      console:`<div class="scr"><div class="field"><label>서비스 검색</label><div class="input prefilled">🔍 IAM <span class="tag">검색됨</span></div></div><div class="svc ck" data-key="open"><span class="sic" style="background:#ec7211">▦</span><div><div class="nm">IAM</div><div class="ds">리소스에 대한 액세스 관리</div></div></div></div>`,
      cli:{ note:`CLI에서는 aws iam 으로 사용자 목록을 먼저 볼 수 있어요.`, lines:[ {cmt:"# 현재 사용자 목록 보기"}, {p:"$",cmd:` aws iam `,flagHtml:flag("list-users","IAM 사용자 목록을 조회하는 명령.")}, {out:"Users: []"} ], copy:"aws iam list-users", help:`<b>aws iam</b> 으로 시작하는 명령들로 IAM을 다뤄요.` }
    },
    {
      title:"사용자 세부 정보 지정",
      intro:`사용자 생성 1단계예요. 사용자 이름은 <b>beginner-dev</b>로 미리 채워져 있어요. 사람이 콘솔에 로그인해 쓸 거라면 <b>AWS Management Console에 대한 사용자 액세스 권한 제공</b>을 체크할 수 있어요(선택). 오른쪽 아래 <b>다음</b>을 누르세요.`,
      console:`<div class="scr"><h4>사용자 세부 정보 지정</h4><div class="field"><label>사용자 이름</label><div class="input prefilled">beginner-dev <span class="tag">입력됨</span></div></div><div class="opt ck" data-key="console"><span class="ck-box"></span><div><div class="nm">AWS Management Console에 대한 사용자 액세스 권한 제공</div><div class="ds">사람이 콘솔에 로그인해 쓸 때만 체크 (선택)</div></div></div><div class="btnrow"><button class="btn primary ck" data-key="next">다음</button></div></div>`,
      cli:{ note:`CLI로는 한 줄로 사용자를 만들어요.`, lines:[ {cmt:"# beginner-dev 사용자 생성"}, {p:"$",cmd:` aws iam `,flagHtml:flag("create-user","사용자를 새로 만드는 명령.")+" --user-name beginner-dev"}, {out:"User: beginner-dev (created)"} ], copy:"aws iam create-user --user-name beginner-dev", help:`<b>--user-name</b> 뒤에 만들 사용자 이름을 적어요.` }
    },
    {
      title:"권한 설정",
      intro:`권한을 주는 방법은 세 가지예요. 보통은 ${term("그룹","같은 권한을 여러 사용자에게 한 번에 주는 묶음. 관리가 편해 실무에서 권장.")}에 ${term("정책","무엇을 할 수 있는지 적어둔 권한 문서(JSON).")}을 붙이지만, 실습에서는 가운데 <b>직접 정책 연결(Attach policies directly)</b>을 클릭하세요.`,
      console:`<div class="scr"><h4>권한 설정</h4><p class="sub">권한 옵션을 하나 고르세요.</p><div class="opt locked"><span class="rd"></span><div><div class="nm">그룹에 사용자 추가</div><div class="ds">그룹에 정책을 붙이고 사용자를 넣기 (권장)</div></div></div><div class="opt ck" data-key="attach"><span class="rd"></span><div><div class="nm">직접 정책 연결(Attach policies directly)</div><div class="ds">관리형 정책을 사용자에게 바로 연결</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">다른 사용자에서 권한 복사</div><div class="ds">기존 사용자의 권한을 그대로 복사</div></div></div></div>`,
      cli:{ note:`CLI는 그룹 없이 정책을 바로 붙일 수도 있어요.`, lines:[ {cmt:"# (참고) 그룹을 만들어 관리하는 방법"}, {p:"$",cmd:` aws iam `,flagHtml:flag("create-group","권한 그룹을 새로 만드는 명령.")+" --group-name dev-team"}, {out:"Group: dev-team (created)"} ], copy:"aws iam create-group --group-name dev-team", help:`${term("최소 권한","딱 필요한 만큼만 권한을 주는 원칙.")} 원칙을 지키면 사고를 줄일 수 있어요.` }
    },
    {
      title:"권한 정책",
      intro:`연결할 ${term("정책","무엇을 할 수 있는지 적어둔 권한 문서.")}을 목록에서 골라요. 모든 권한이 필요하면 <b>AdministratorAccess</b>, 읽기만 필요하면 ${term("최소 권한","딱 필요한 만큼만 주는 원칙. 읽기 전용부터 권해요.")}에 가까운 <b>ReadOnlyAccess</b>를 체크하세요. 체크한 뒤 <b>다음</b>을 누르세요.`,
      needs:2,
      console:`<div class="scr"><h4>권한 정책</h4><p class="sub">연결할 정책을 체크하세요.</p><div class="opt ck" data-key="admin"><span class="ck-box"></span><div><div class="nm">AdministratorAccess</div><div class="ds">모든 권한 (실습·관리용)</div></div></div><div class="opt ck" data-key="readonly"><span class="ck-box"></span><div><div class="nm">ReadOnlyAccess</div><div class="ds">읽기만 가능 (최소 권한에 가까움)</div></div></div><div class="btnrow"><button class="btn primary ck" data-key="next">다음</button></div></div>`,
      cli:{ note:`CLI는 정책을 ARN으로 지정해 사용자에게 붙여요.`, lines:[ {cmt:"# 읽기 전용 정책을 사용자에게 연결"}, {p:"$",cmd:` aws iam `,flagHtml:flag("attach-user-policy","관리형 정책을 사용자에게 직접 연결하는 명령.")+" \\"}, {cmd:"    --user-name beginner-dev \\"}, {cmd:"    ",flagHtml:flag("--policy-arn","연결할 정책의 고유 주소(ARN).")+" arn:aws:iam::aws:policy/ReadOnlyAccess"} ], copy:"aws iam attach-user-policy --user-name beginner-dev --policy-arn arn:aws:iam::aws:policy/ReadOnlyAccess", help:`<b>--policy-arn</b> 은 연결할 정책의 고유 주소예요.` }
    },
    {
      title:"검토 및 생성",
      intro:`고른 내용을 확인해요. 문제 없으면 오른쪽 아래 <b>사용자 생성</b> 버튼을 누르세요.`,
      console:`<div class="scr"><h4>검토 및 생성</h4><div class="rowsum"><span class="k">사용자 이름</span><span class="v">beginner-dev</span></div><div class="rowsum"><span class="k">권한 요약</span><span class="v">정책 직접 연결</span></div><div class="rowsum"><span class="k">정책</span><span class="v">ReadOnlyAccess</span></div><div class="btnrow"><button class="btn primary ck" data-key="create">사용자 생성</button></div></div>`,
      cli:{ note:`만든 사용자에 연결된 정책을 확인해요.`, lines:[ {p:"$",cmd:` aws iam list-attached-user-policies --user-name beginner-dev`}, {out:"AttachedPolicies: ReadOnlyAccess"} ], copy:"aws iam list-attached-user-policies --user-name beginner-dev", help:`연결된 정책은 바로 적용돼요.` }
    },
    {
      title:"완료",
      intro:`사용자 준비가 끝났어요. 생성 후 <b>보안 자격 증명</b> 탭에서 ${term("MFA","Multi-Factor Authentication. 비밀번호 외에 휴대폰 코드까지 확인하는 2차 인증. 루트·관리자 계정엔 꼭 켜세요.")}를 할당하거나, CLI·프로그램 접속용 ${term("액세스 키","CLI·코드가 AWS에 접속할 때 쓰는 아이디·비밀번호 쌍.")}를 발급할 수 있어요. 사람이 다른 권한을 잠깐 빌릴 땐 ${term("역할(role)","특정 작업을 할 때 잠깐 빌려 쓰는 권한 꾸러미.")}도 많이 써요. <b>완료</b>를 누르면 마무리돼요.`,
      finish:true,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ 사용자를 생성했습니다</h4><div class="rowsum"><span class="k">사용자</span><span class="v">beginner-dev</span></div><div class="rowsum"><span class="k">권한</span><span class="v">정책 직접 연결됨</span></div><div class="rowsum"><span class="k">다음 할 일</span><span class="v">MFA 할당 · 액세스 키</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">완료</button></div></div>`,
      cli:{ note:`프로그램 접속용 액세스 키 발급 예시예요.`, lines:[ {cmt:"# 액세스 키 발급"}, {p:"$",cmd:` aws iam `,flagHtml:flag("create-access-key","접속용 액세스 키를 발급하는 명령.")+" --user-name beginner-dev"}, {out:"AccessKeyId: AKIA... / SecretAccessKey: ****"} ], copy:"aws iam create-access-key --user-name beginner-dev", help:`SecretAccessKey는 이때 딱 한 번만 보여요. 꼭 안전하게 보관하세요.` }
    }
  ]
},
{
  id:"ec2", ch:2, icon:"🖥️", name:"EC2 서버 띄우기",
  label:"챕터 2 · EC2 — 가상 서버 한 대 만들기",
  doneMsg:"가상 서버(EC2 인스턴스) 한 대를 실제 '인스턴스 시작' 페이지처럼 설정해 만들었어요.",
  steps:[
    {
      title:"인스턴스 시작",
      intro:`${term("EC2","Elastic Compute Cloud. 클라우드에서 빌려 쓰는 가상 서버")} 인스턴스 목록 페이지입니다. 오른쪽 위 주황색 <b>인스턴스 시작(Launch instance)</b> 버튼을 누르면, 실제처럼 한 페이지짜리 설정 화면이 열립니다.`,
      console:`<div class="scr">
        <h4>인스턴스</h4>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <p class="sub" style="margin:0">실행 중인 인스턴스 (0)</p>
          <button class="btn primary ck" data-key="launch0">인스턴스 시작 ▾</button>
        </div>
      </div>
      <div class="scr" style="text-align:center;color:var(--muted)">아직 인스턴스가 없습니다. 위 버튼으로 첫 서버를 만들어 보세요.</div>`,
      cli:{ note:`CLI는 목록 확인 → 한 줄로 생성(다음 페이지).`,
        lines:[ {cmt:"# 현재 인스턴스 목록"}, {p:"$",cmd:` aws ec2 `,flagHtml:flag("describe-instances","인스턴스 목록 조회")}, {out:"(없음)"} ],
        copy:"aws ec2 describe-instances", help:`<b>인스턴스 시작</b> 버튼 = CLI의 <b>run-instances</b>.` }
    },
    {
      title:"인스턴스 시작 (설정)",
      intro:`실제 콘솔처럼 <b>한 페이지</b>에서 이름·이미지(AMI)·유형·키 페어·네트워크·스토리지를 모두 정합니다. 아래에서 ${term("AMI","서버에 깔 운영체제 이미지")}·유형·방화벽을 고른 뒤, 오른쪽 <b>요약</b>의 <b>인스턴스 시작</b>을 누르세요.`,
      needs:5,
      console:`<div class="awsform">
        <div class="formcol">

          <div class="scr">
            <h4>이름 및 태그</h4>
            <div class="field"><label>이름</label><div class="input prefilled">my-web-server <span class="tag">입력됨</span></div></div>
          </div>

          <div class="scr">
            <h4>애플리케이션 및 OS 이미지(Amazon Machine Image)</h4>
            <div class="opt ck" data-key="ami"><span class="rd"></span><div><div class="nm">Amazon Linux 2023 AMI</div><div class="ds">ami-0abc… · 64비트(x86)</div></div><span class="free">프리 티어 사용 가능</span></div>
            <div class="opt wrong" data-why="Ubuntu도 프리 티어로 쓸 수 있지만, 이번 실습은 Amazon Linux 2023 기준이에요. 위의 Amazon Linux 2023을 고르세요."><span class="rd"></span><div><div class="nm">Ubuntu Server 24.04 LTS</div><div class="ds">ami-0def…</div></div></div>
            <div class="opt wrong" data-why="Microsoft Windows Server는 프리 티어가 아니라 시간당 요금이 나와요. 연습·초심자는 Amazon Linux 2023을 고르세요."><span class="rd"></span><div><div class="nm">Microsoft Windows Server 2022</div><div class="ds">ami-0ghi… · 요금 발생</div></div></div>
          </div>

          <div class="scr">
            <h4>인스턴스 유형</h4>
            <div class="opt ck" data-key="type"><span class="rd"></span><div><div class="nm">t2.micro</div><div class="ds">vCPU 1 · 메모리 1 GiB</div></div><span class="free">프리 티어 사용 가능</span></div>
            <div class="opt wrong" data-why="t3.small은 프리 티어가 아니에요 — 켜 두면 요금이 발생합니다. 프리 티어 사용 가능한 t2.micro를 고르세요."><span class="rd"></span><div><div class="nm">t3.small</div><div class="ds">vCPU 2 · 메모리 2 GiB · 요금 발생</div></div></div>

    {
      title:"트리거 추가 (Add trigger)",
      intro:`함수를 '언제' 실행할지 정하는 게 ${term("트리거","함수를 자동으로 실행시키는 이벤트나 호출원")} 예요. 함수 개요 화면에서 <b>트리거 추가(Add trigger)</b>를 누르고, 웹 주소(HTTP)로 호출되도록 소스에서 ${term("API Gateway","HTTP 요청을 받아 Lambda 로 연결해주는 입구 서비스")} 를 클릭하세요. 요청이 몰리면 함수가 여러 개 동시에 실행되는데, 이를 ${term("동시성","같은 함수가 동시에 실행되는 개수")} 라고 해요.`,
      needs:1,
      console:`<div class="scr"><h4>트리거 추가 (Add trigger)</h4><p class="sub">소스를 하나 골라 클릭하세요.</p><div class="opt ck" data-key="apigw"><span class="rd"></span><div><div class="nm">API Gateway</div><div class="ds">웹 주소(HTTP)로 함수 호출</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">S3 (잠금)</div><div class="ds">파일 업로드 시 호출 — 이번 실습 제외</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">EventBridge (잠금)</div><div class="ds">일정·이벤트로 호출 — 이번 실습 제외</div></div></div></div>`,
      cli:{ note:`API Gateway 가 함수를 호출할 권한을 줘요.`,
        lines:[ {cmt:"# API Gateway 에 함수 호출 권한 부여"}, {p:"$",cmd:` aws lambda `,flagHtml:flag("add-permission","다른 서비스가 함수를 호출하도록 허용하는 명령")} ],
        copy:"aws lambda add-permission --function-name my-function --action lambda:InvokeFunction --principal apigateway.amazonaws.com --statement-id apigw",
        help:`이렇게 해야 웹 요청이 들어올 때 함수가 실행돼요.` }
    },
    {
      title:"테스트 실행 (Test)",
      intro:`함수 화면의 <b>테스트(Test)</b> 탭에서 이벤트를 구성한 뒤 직접 실행해봐요. 한동안 안 쓰던 함수의 첫 실행엔 준비 시간이 걸리는 ${term("cold start","안 쓰던 함수가 처음 깨어날 때 생기는 짧은 지연. 콜드 스타트")} 가 있을 수 있어요. 또 함수 한 번 실행은 최대 ${term("제한 시간","Lambda 한 번 실행은 최대 15분까지만 가능")} 15분까지만 돼요. 이벤트는 채워져 있으니 <b>테스트(Test)</b> 버튼을 누르세요.`,
      needs:1,
      console:`<div class="scr"><h4>테스트 (Test) 탭</h4><div class="field"><label>이벤트 이름</label><div class="input prefilled">myTestEvent <span class="tag">입력됨</span></div></div><div class="field"><label>이벤트 JSON</label><div class="input prefilled">{ } <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="test">테스트</button></div></div>`,
      cli:{ note:`CLI 로 함수를 직접 호출(실행)해요.`,
        lines:[ {cmt:"# 함수 실행, 응답을 response.json 에 저장"}, {p:"$",cmd:` aws lambda `,flagHtml:flag("invoke","함수를 실행(호출)하는 명령")}, {out:"StatusCode: 200  ExecutedVersion: $LATEST"} ],
        copy:"aws lambda invoke --function-name my-function --payload '{}' response.json",
        help:`<b>StatusCode 200</b> 이면 정상 실행된 거예요.` }
    },
    {
      title:"완료",
      intro:`서버 한 대 없이 코드가 실행됐어요. 서버리스의 핵심을 경험한 거예요. <b>완료</b> 버튼을 누르면 마무리돼요.`,
      finish:true,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ 실행 완료</h4><div class="rowsum"><span class="k">함수</span><span class="v">my-function</span></div><div class="rowsum"><span class="k">런타임</span><span class="v">Python 3.12</span></div><div class="rowsum"><span class="k">트리거</span><span class="v">API Gateway</span></div><div class="rowsum"><span class="k">결과</span><span class="v" style="color:var(--ok)">StatusCode 200</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">완료</button></div></div>`,
      cli:{ note:`함수 상태를 확인해봐요.`,
        lines:[ {p:"$",cmd:` aws lambda get-function --function-name my-function`}, {out:"State: Active  LastUpdateStatus: Successful"} ],
        copy:"aws lambda get-function --function-name my-function",
        help:`끝! 쓴 만큼만 비용이 드는 서버리스 함수가 완성됐어요.` }
    }
  ]

{
  id:"container", ch:5, icon:"🐳", name:"컨테이너 배포",
  label:"챕터 5 · 컨테이너 — ECR에 담고 ECS Fargate로 띄우기",
  doneMsg:"이미지를 ECR에 올리고 ECS Fargate 서비스로 실행하는 흐름을 전부 클릭으로 끝냈어요.",
  steps:[
    {
      title:"ECR 리포지토리 생성 (Create repository)",
      intro:`먼저 ${term("컨테이너","앱과 실행 환경을 하나로 묶은 상자")}를 찍어내는 설계도인 ${term("이미지","컨테이너를 만들어내는 템플릿 파일")}를 보관할 창고가 필요해요. AWS의 이미지 저장소가 ${term("ECR","Elastic Container Registry, AWS가 관리하는 컨테이너 이미지 저장소")}예요. 가시성에서 <b>프라이빗(Private)</b>을 고르고, 이름은 <b>my-app</b>으로 채워져 있으니 <b>리포지토리 생성</b> 버튼을 누르세요.`,
      needs:2,
      console:`<div class="scr"><h4>Amazon ECR · 리포지토리 생성 (Create repository)</h4><p class="sub">가시성을 고르고 리포지토리를 만듭니다.</p><div class="opt ck" data-key="private"><span class="rd"></span><div><div class="nm">프라이빗 (Private)</div><div class="ds">내 계정만 접근 — 일반적인 선택</div></div></div><div class="opt ck" data-key="public"><span class="rd"></span><div><div class="nm">퍼블릭 (Public)</div><div class="ds">누구나 pull 가능한 공개 저장소</div></div></div><div class="field"><label>리포지토리 이름</label><div class="input prefilled">my-app <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">리포지토리 생성</button></div></div>`,
      cli:{ note:`CLI 한 줄로도 똑같이 만들 수 있어요.`, lines:[ {cmt:"# 프라이빗 이미지 창고(리포지토리) 생성"}, {p:"$",cmd:` aws ecr `,flagHtml:flag("create-repository","ECR 리포지토리를 만드는 명령")}, {out:"repositoryUri: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/my-app"} ], copy:"aws ecr create-repository --repository-name my-app", help:`<b>repositoryUri</b> 가 이미지를 올릴 주소예요. 앞의 숫자는 내 AWS 계정 번호랍니다.` }
    },
    {
      title:"푸시 명령 보기 (View push commands)",
      intro:`방금 만든 리포지토리 화면 오른쪽 위의 <b>푸시 명령 보기(View push commands)</b>를 누르면, 내 컴퓨터의 이미지를 창고로 올리는 명령 4줄을 그대로 알려줘요. 로그인 → 빌드 → 태그 → 푸시 순서예요. 버튼을 눌러 명령을 확인하세요. 실제 docker 명령은 오른쪽 CLI 창에 있어요.`,
      console:`<div class="scr"><h4>푸시 명령 보기</h4><p class="sub">리포지토리로 이미지를 올리는 명령을 안내합니다.</p><div class="rowsum"><span class="k">대상 리포지토리</span><span class="v">my-app</span></div><div class="rowsum"><span class="k">태그</span><span class="v">latest</span></div><div class="btnrow"><button class="btn primary ck" data-key="push">푸시 명령 보기</button></div></div>`,
      cli:{ note:`콘솔이 알려주는 4단계 그대로예요. 로그인 → 빌드 → 태그 → 푸시.`, lines:[ {cmt:"# 1) ECR 로그인 토큰을 받아 도커 로그인"}, {p:"$",cmd:` aws ecr `,flagHtml:flag("get-login-password","로그인용 임시 토큰을 받는 명령")}, {cmt:"# 2) 이미지 빌드  3) 태그  4) 푸시"}, {p:"$",cmd:` docker build -t my-app . && docker tag my-app:latest 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/my-app:latest`}, {p:"$",cmd:` docker push 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/my-app:latest`}, {out:"latest: digest: sha256:... pushed"} ], copy:"aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com", help:`<b>push</b> 는 이미지를 창고로 올리고, <b>pull</b> 은 내려받는 동작이에요.` }
    },
    {
      title:"ECS 클러스터 생성 (Create cluster)",
      intro:`컨테이너를 실제로 돌릴 공간이 ${term("ECS","Elastic Container Service, AWS의 컨테이너 오케스트레이터")} 클러스터예요. 인프라를 고르는데, 서버를 직접 관리하기 싫다면 서버리스인 ${term("Fargate","서버 관리가 전혀 필요 없는 서버리스 컨테이너 실행 방식")}를 고르세요. 쿠버네티스가 익숙하면 ${term("EKS","Elastic Kubernetes Service, 관리형 쿠버네티스")}도 있지만 초심자는 ECS가 쉬워요. <b>AWS Fargate(서버리스)</b>를 클릭하고 <b>생성</b>까지 누르세요.`,
      needs:2,
      console:`<div class="scr"><h4>ECS 클러스터 · 생성 (Create cluster)</h4><div class="field"><label>클러스터 이름</label><div class="input prefilled">my-cluster <span class="tag">입력됨</span></div></div><p class="sub">인프라를 골라 클릭하세요.</p><div class="opt ck" data-key="fargate"><span class="rd"></span><div><div class="nm">AWS Fargate (서버리스)</div><div class="ds">서버 관리 없이 컨테이너만 실행 — 초심자 추천</div></div></div><div class="opt ck" data-key="ec2"><span class="rd"></span><div><div class="nm">Amazon EC2 인스턴스</div><div class="ds">내가 직접 서버(인스턴스)를 띄워 관리</div></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">생성</button></div></div>`,
      cli:{ note:`클러스터 생성은 이름만 주면 끝나요.`, lines:[ {cmt:"# 클러스터 생성 (Fargate는 서버 프로비저닝이 없음)"}, {p:"$",cmd:` aws ecs `,flagHtml:flag("create-cluster","ECS 클러스터를 만드는 명령")}, {out:"clusterArn: ...:cluster/my-cluster  status: ACTIVE"} ], copy:"aws ecs create-cluster --cluster-name my-cluster", help:`<b>클러스터</b> 는 서비스들을 묶는 논리적 그룹일 뿐이라, 이름만 있으면 바로 생겨요.` }
    },
    {
      title:"태스크 정의 · 서비스 생성 (Create service)",
      intro:`${term("태스크 정의","Task definition, 어떤 이미지를 얼마의 CPU·메모리·역할로 돌릴지 적은 설계서")}에 돌릴 이미지와 자원을 적고, ${term("서비스","태스크를 원하는 개수만큼 유지해 주는 관리자")}로 실행해요. 권한이 두 종류라 헷갈리지 마세요. 이미지를 받고 로그를 쓰는 준비용인 ${term("실행 역할","Execution Role, ECS가 이미지를 받고 로그를 쓰는 실행 준비용 권한")}과, 컨테이너 안의 앱이 S3 같은 다른 서비스를 쓸 때 쓰는 ${term("태스크 역할","Task Role, 실행 중인 앱이 다른 AWS 서비스를 호출할 때 쓰는 권한")}이에요. <b>태스크 정의 생성</b> 후 <b>서비스 생성</b>을 누르세요.`,
      needs:2,
      console:`<div class="scr"><h4>태스크 정의 &amp; 서비스</h4><div class="field"><label>이미지</label><div class="input prefilled">my-app:latest <span class="tag">입력됨</span></div></div><div class="rowsum"><span class="k">CPU / 메모리</span><span class="v">0.25 vCPU / 0.5GB</span></div><div class="rowsum"><span class="k">실행 역할 (Execution)</span><span class="v">ecsTaskExecutionRole</span></div><div class="rowsum"><span class="k">태스크 역할 (Task)</span><span class="v">appTaskRole</span></div><div class="rowsum"><span class="k">원하는 작업 수</span><span class="v">2</span></div><div class="btnrow"><button class="btn primary ck" data-key="task">태스크 정의 생성</button><button class="btn primary ck" data-key="service">서비스 생성</button></div></div>`,
      cli:{ note:`태스크 정의를 등록하고 서비스로 띄우는 두 단계예요.`, lines:[ {cmt:"# 1) 태스크 정의 등록 (설계서를 JSON으로)"}, {p:"$",cmd:` aws ecs `,flagHtml:flag("register-task-definition","태스크 정의를 등록하는 명령")}, {cmt:"# 2) 서비스로 실행 (Fargate, 작업 2개)"}, {p:"$",cmd:` aws ecs `,flagHtml:flag("create-service","원하는 개수만큼 태스크를 유지하는 서비스 생성")}, {out:"service my-svc created  desiredCount: 2  runningCount: 2"} ], copy:"aws ecs create-service --cluster my-cluster --service-name my-svc --task-definition my-task --desired-count 2 --launch-type FARGATE", help:`<b>실행 역할 vs 태스크 역할</b> — 실행 역할은 ECS가 이미지를 받아 컨테이너를 띄우는 준비용, 태스크 역할은 실행 중인 앱이 다른 서비스를 호출할 때 쓰는 권한이에요.` }
    },
    {
      title:"배포 완료 확인",
      intro:`서비스가 살아 있는지 확인하면 끝이에요. runningCount가 올라오면 컨테이너가 응답할 준비가 된 거예요. <b>완료</b> 버튼을 눌러 마무리하세요.`,
      finish:true,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ 서비스 실행 중</h4><div class="rowsum"><span class="k">서비스</span><span class="v">my-svc</span></div><div class="rowsum"><span class="k">상태</span><span class="v">ACTIVE · runningCount 2/2</span></div><div class="rowsum"><span class="k">클러스터</span><span class="v">my-cluster (Fargate)</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">완료</button></div></div>`,
      cli:{ note:`서비스 상태 조회로 마무리:`, lines:[ {p:"$",cmd:` aws ecs describe-services --cluster my-cluster --services my-svc`}, {out:"status: ACTIVE  desiredCount: 2  runningCount: 2"} ], copy:"aws ecs describe-services --cluster my-cluster --services my-svc", help:`끝났어요! ECR(창고) → ECS Fargate(실행)의 가장 기본 흐름을 익혔습니다.` }
    }
  ]
},
{
  id:"vpc", ch:6, icon:"🕸️", name:"VPC 네트워크",
  label:"챕터 6 · VPC 네트워킹 — 마법사로 전용 네트워크 한 번에 만들기",
  doneMsg:"실제 콘솔처럼 한 페이지 마법사에서 서브넷·라우팅 테이블·인터넷 게이트웨이까지 네트워크 뼈대를 한 번에 세웠어요.",
  steps:[
    {
      title:"VPC 생성",
      intro:`${term("VPC","Virtual Private Cloud. AWS 안에 나만 쓰는 격리된 가상 네트워크")} 목록 페이지입니다. 기본 VPC 말고 내 전용 네트워크를 만들어 볼게요. 오른쪽 위 <b>VPC 생성(Create VPC)</b> 버튼을 누르면, 실제처럼 한 페이지짜리 마법사가 열립니다.`,
      console:`<div class="scr">
        <h4>VPC</h4>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <p class="sub" style="margin:0">VPC (1) · 기본 VPC 만 있음</p>
          <button class="btn primary ck" data-key="createvpc">VPC 생성</button>
        </div>
      </div>
      <div class="scr" style="text-align:center;color:var(--muted)">기본 VPC 외에는 아직 없습니다. 위 버튼으로 전용 네트워크를 만들어 보세요.</div>`,
      cli:{ note:`CLI 에선 현재 리전의 VPC 목록부터 볼 수 있어요.`,
        lines:[ {cmt:"# 서울 리전의 VPC 목록 보기"}, {p:"$",cmd:` aws ec2 `,flagHtml:flag("describe-vpcs","VPC 목록을 조회하는 명령")}, {out:"Vpcs: [ default vpc ... ]"} ],
        copy:"aws ec2 describe-vpcs --region ap-northeast-2",
        help:`콘솔의 <b>VPC 등</b> 마법사가 한 번에 하는 일을, CLI 에선 여러 명령으로 나눠서 해요.` }
    },
    {
      title:"VPC 생성 (설정)",
      intro:`실제 콘솔처럼 <b>한 페이지</b>에서 범위·이름·CIDR·AZ 수·${term("NAT 게이트웨이","프라이빗 서브넷이 인터넷으로 나가게만 해주는 단방향 관문. 유료")}·엔드포인트를 모두 정합니다. 서브넷·라우팅 테이블·${term("인터넷 게이트웨이","IGW. VPC 와 인터넷을 잇는 관문")}까지 자동으로 만들어 주는 <b>VPC 등(VPC and more)</b>을 고르고, ${term("AZ","Availability Zone. 물리적으로 분리된 데이터센터 구역")} 수와 NAT 를 정한 뒤, 오른쪽 <b>미리 보기</b>의 <b>VPC 생성</b>을 누르세요.`,
      needs:4,
      console:`<div class="awsform">
        <div class="formcol">

          <div class="scr">
            <h4>생성할 리소스</h4>
            <div class="opt locked"><span class="rd"></span><div><div class="nm">VPC만 (VPC only)</div><div class="ds">VPC 한 개만 생성, 나머지는 직접 추가</div></div></div>
            <div class="opt ck" data-key="more"><span class="rd"></span><div><div class="nm">VPC 등 (VPC and more)</div><div class="ds">서브넷·라우팅 테이블·인터넷 게이트웨이까지 자동 생성 — 추천</div></div></div>
          </div>

          <div class="scr">
            <h4>이름 및 주소 범위</h4>
            <div class="field"><label>이름 태그 자동 생성</label><div class="input prefilled">project <span class="tag">입력됨</span></div></div>
            <div class="field"><label>IPv4 ${term("CIDR","네트워크 주소 범위 표기법, 예 10.0.0.0/16")} 블록</label><div class="input prefilled">10.0.0.0/16 <span class="tag">입력됨</span></div></div>
          </div>

          <div class="scr">
            <h4>가용 영역(AZ) 수</h4>
            <p class="sub">몇 개 AZ 에 나눠 배치할지 고르세요.</p>
            <div class="opt ck" data-key="az2"><span class="rd"></span><div><div class="nm">AZ 2개</div><div class="ds">ap-northeast-2a · 2c 두 곳에 분산 — 권장</div></div></div>
            <div class="opt locked"><span class="rd"></span><div><div class="nm">AZ 1개</div><div class="ds">단일 AZ · 가용성 낮음</div></div></div>
            <div class="field"><label>퍼블릭 / 프라이빗 서브넷 수</label><div class="input prefilled">퍼블릭 2 · 프라이빗 2 <span class="tag">자동</span></div></div>
          </div>

          <div class="scr">
            <h4>NAT 게이트웨이</h4>
            <p class="sub">프라이빗 서브넷의 외부 통신 여부를 고르세요.</p>
            <div class="opt ck" data-key="natnone"><span class="rd"></span><div><div class="nm">없음 (None)</div><div class="ds">비용 절감 · 연습용 권장</div></div></div>
            <div class="opt locked"><span class="rd"></span><div><div class="nm">1개 AZ</div><div class="ds">NAT 1대 · 유료</div></div></div>
            <div class="opt locked"><span class="rd"></span><div><div class="nm">AZ당 1개</div><div class="ds">AZ 마다 NAT · 고가용성 · 유료</div></div></div>
          </div>

          <div class="scr">
            <h4>VPC 엔드포인트</h4>
            <div class="field"><label>엔드포인트</label><div class="input prefilled">S3 게이트웨이 <span class="tag">기본값</span></div></div>
          </div>

        </div>

        <aside class="summarycol">
          <div class="scr summary">
            <h4>미리 보기 (Preview)</h4>
            <div class="rowsum"><span class="k">VPC</span><span class="v">1 · 10.0.0.0/16</span></div>
            <div class="rowsum"><span class="k">서브넷</span><span class="v">4 (퍼블릭 2 · 프라이빗 2)</span></div>
            <div class="rowsum"><span class="k">라우팅 테이블</span><span class="v">2 (퍼블릭 1 · 프라이빗 1)</span></div>
            <div class="rowsum"><span class="k">인터넷 게이트웨이</span><span class="v">1 (자동 연결)</span></div>
            <button class="btn primary ck" data-key="create">VPC 생성</button>
            <p class="sumnote">왼쪽에서 범위·AZ 수·NAT 를 고른 뒤 이 버튼을 누르면 네트워크가 한 번에 생성됩니다.</p>
          </div>
        </aside>
      </div>`,
      cli:{ note:`마법사가 한 번에 하는 일을 CLI 로 풀면 여러 명령이에요.`,
        lines:[
          {cmt:"# VPC 생성"}, {p:"$",cmd:` aws ec2 `,flagHtml:flag("create-vpc","VPC 를 만드는 명령")},
          {cmt:"# 뒤이어 서브넷·게이트웨이·라우팅을 각각 생성·연결"},
          {p:"$",cmd:` aws ec2 create-subnet --vpc-id vpc-0a1b2c --cidr-block 10.0.0.0/20 --availability-zone ap-northeast-2a`},
          {out:"VpcId: vpc-0a1b2c  State: available  (subnets: 4, igw: attached)"}
        ],
        copy:"aws ec2 create-vpc --cidr-block 10.0.0.0/16",
        help:`콘솔의 <b>VPC 등</b>은 아래 일(서브넷·IGW·라우팅)을 한 번에 묶어 실행해줘요. <b>IGW</b> 는 만든 뒤 VPC 에 attach 해야 인터넷이 열려요.` }
    },
    {
      title:"완료 — 네트워크 준비 완료",
      intro:`VPC, 서브넷 4개, 인터넷 게이트웨이, ${term("라우팅 테이블","어떤 목적지로 가려면 어디로 보낼지 적어둔 이정표")}가 한 번에 자리 잡았어요. 이 위에 EC2 나 RDS 를 올리면 안전하게 격리된 네트워크에서 돌아갑니다. <b>완료</b> 버튼으로 마무리합니다.`,
      finish:true,
      console:`<div class="scr" style="border-color:var(--ok)">
        <h4 style="color:var(--ok)">✓ project-vpc — 준비 완료</h4>
        <div class="rowsum"><span class="k">VPC</span><span class="v">project-vpc · 10.0.0.0/16</span></div>
        <div class="rowsum"><span class="k">서브넷</span><span class="v">퍼블릭 2 · 프라이빗 2</span></div>
        <div class="rowsum"><span class="k">인터넷</span><span class="v" style="color:var(--ok)">IGW 자동 연결됨</span></div>
        <div class="rowsum"><span class="k">NAT</span><span class="v">없음 (비용 0)</span></div>
        <div class="btnrow"><button class="btn primary ck" data-key="done">완료</button></div>
      </div>`,
      cli:{ note:`구성 요약 조회로 마무리:`,
        lines:[ {p:"$",cmd:` aws ec2 describe-vpcs --vpc-ids vpc-0a1b2c`}, {out:"CidrBlock: 10.0.0.0/16  State: available  (subnets: 4, igw: attached)"} ],
        copy:"aws ec2 describe-vpcs --vpc-ids vpc-0a1b2c",
        help:`완성! 격리된 전용 네트워크가 준비됐어요.` }
    }
  ]
},
{
  id:"edge", ch:7, icon:"🛡️", name:"보안 그룹 · NACL",
  label:"챕터 7 · 보안 그룹 · NACL — 서버 앞단 방화벽 열기",
  doneMsg:"인바운드 규칙(SSH 22 · HTTP 80)을 한 페이지에서 정해 보안 그룹을 만들었어요. 서버 앞단 방화벽이 열렸고, 서브넷 방화벽인 NACL과의 차이도 짚었습니다.",
  steps:[
    {
      title:"보안 그룹 생성",
      intro:`EC2 왼쪽 메뉴 <b>네트워크 및 보안 > 보안 그룹</b> 목록 페이지입니다. 오른쪽 위 주황색 <b>보안 그룹 생성(Create security group)</b> 버튼을 누르면, 실제처럼 한 페이지짜리 설정 화면이 열립니다.`,
      console:`<div class="scr">
        <h4>보안 그룹</h4>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <p class="sub" style="margin:0">보안 그룹 (0)</p>
          <button class="btn primary ck" data-key="create">보안 그룹 생성</button>
        </div>
      </div>
      <div class="scr" style="text-align:center;color:var(--muted)">아직 보안 그룹이 없습니다. 위 버튼으로 첫 방화벽을 만들어 보세요.</div>`,
      cli:{ note:`CLI로는 현재 보안 그룹 목록부터 확인해요.`,
        lines:[ {cmt:"# 내 보안 그룹 목록 보기"}, {p:"$",cmd:` aws ec2 `,flagHtml:flag("describe-security-groups","보안 그룹 목록 조회")}, {out:"(기본 보안 그룹만 있음)"} ],
        copy:"aws ec2 describe-security-groups", help:`<b>보안 그룹 생성</b> 버튼 = CLI의 <b>create-security-group</b>.` }
    },
    {
      title:"보안 그룹 생성 (설정)",
      intro:`실제 콘솔처럼 <b>한 페이지</b>에서 기본 정보·인바운드·아웃바운드 규칙을 모두 정합니다. 이름·설명·VPC는 채워 뒀으니, 아래 <b>인바운드 규칙</b>에서 SSH·HTTP를 켠 뒤 맨 아래 <b>보안 그룹 생성</b> 버튼을 누르세요. ${term("보안 그룹","서버 앞단 방화벽. stateful — 들어온 요청의 응답은 자동 허용")}은 서버(인스턴스) 단위이고, ${term("네트워크 ACL","서브넷 단위 방화벽. stateless — 인·아웃 규칙을 따로 열어야 함")}은 서브넷 단위라는 점이 핵심 차이입니다.`,
      needs:3,
      console:`<div class="scr">
        <h4>기본 세부 정보</h4>
        <div class="field"><label>보안 그룹 이름</label><div class="input prefilled">web-sg <span class="tag">입력됨</span></div></div>
        <div class="field"><label>설명</label><div class="input prefilled">web server inbound rules <span class="tag">입력됨</span></div></div>
        <div class="field"><label>VPC</label><div class="input prefilled">vpc-0a1b2c3d (기본 VPC) <span class="tag">선택됨</span></div></div>
      </div>
      <div class="scr">
        <h4>인바운드 규칙</h4>
        <p class="sub">외부에서 서버로 <b>들어오는</b> 트래픽을 허용합니다. (둘 다 선택)</p>
        <div class="opt ck" data-key="ssh"><span class="ck-box"></span><div><div class="nm">SSH (포트 22)</div><div class="ds">소스 0.0.0.0/0 — 내가 서버에 접속</div></div></div>
        <div class="opt ck" data-key="http"><span class="ck-box"></span><div><div class="nm">HTTP (포트 80)</div><div class="ds">소스 0.0.0.0/0 — 방문자가 웹사이트 열람</div></div></div>
      </div>
      <div class="scr">
        <h4>아웃바운드 규칙</h4>
        <div class="field"><label>규칙</label><div class="input prefilled">모든 트래픽 허용 (0.0.0.0/0) <span class="tag">기본값</span></div></div>
        <p class="sub" style="margin:6px 0 0">보안 그룹은 stateful이라 들어온 요청의 응답은 이 규칙과 무관하게 자동으로 나갑니다.</p>
      </div>
      <div class="scr"><div class="btnrow"><button class="btn primary ck" data-key="go">보안 그룹 생성</button></div></div>`,
      cli:{ note:`빈 보안 그룹을 만든 뒤 인바운드 규칙 두 개를 추가합니다.`,
        lines:[
          {cmt:"# 보안 그룹 생성"},
          {p:"$",cmd:` aws ec2 `,flagHtml:flag("create-security-group","보안 그룹 생성")},
          {out:"GroupId: sg-0ab12cd34ef56"},
          {cmt:"# 인바운드 규칙 추가 (SSH 22 · HTTP 80)"},
          {p:"$",cmd:` aws ec2 `,flagHtml:flag("authorize-security-group-ingress","인바운드 규칙 추가")+` \\`},
          {cmd:`    --group-id sg-0ab12cd34ef56 \\`},
          {cmd:`    --protocol tcp --port 22 --cidr 0.0.0.0/0`},
          {out:"(규칙 추가됨)"}
        ],
        copy:"aws ec2 authorize-security-group-ingress --group-id sg-0ab12cd34ef56 --protocol tcp --port 22 --cidr 0.0.0.0/0",
        help:`HTTP도 같은 명령에서 <b>--port 80</b> 으로 한 번 더 추가해요. <b>--cidr 0.0.0.0/0</b> 은 어디서든 접속 허용이라, 실서비스의 SSH는 내 IP로 좁히는 게 안전합니다.` }
    },
    {
      title:"완료 — 방화벽 생성됨",
      intro:`보안 그룹 <b>sg-0ab12cd34ef56</b> 가 만들어졌어요. 이제 EC2 인스턴스에 이 보안 그룹을 붙이면 SSH·HTTP가 열립니다. 아래 표로 ${term("보안 그룹","서버 단위 stateful 방화벽")}과 ${term("네트워크 ACL","서브넷 단위 stateless 방화벽")}의 차이를 한 번 더 정리해 둘게요.`,
      finish:true,
      console:`<div class="scr" style="border-color:var(--ok)">
        <h4 style="color:var(--ok)">✓ 보안 그룹 sg-0ab12cd34ef56 — 생성됨</h4>
        <div class="rowsum"><span class="k">이름</span><span class="v">web-sg</span></div>
        <div class="rowsum"><span class="k">인바운드</span><span class="v">SSH 22, HTTP 80 (0.0.0.0/0)</span></div>
        <div class="rowsum"><span class="k">아웃바운드</span><span class="v">모든 트래픽 허용</span></div>
      </div>
      <div class="scr">
        <h4>보안 그룹 vs 네트워크 ACL</h4>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <tr style="text-align:left"><th style="padding:6px;border-bottom:1px solid var(--line)">구분</th><th style="padding:6px;border-bottom:1px solid var(--line)">보안 그룹</th><th style="padding:6px;border-bottom:1px solid var(--line)">네트워크 ACL</th></tr>
          <tr><td style="padding:6px;border-bottom:1px solid var(--line)">적용 범위</td><td style="padding:6px;border-bottom:1px solid var(--line)">인스턴스(서버) 단위</td><td style="padding:6px;border-bottom:1px solid var(--line)">서브넷 단위</td></tr>
          <tr><td style="padding:6px;border-bottom:1px solid var(--line)">상태</td><td style="padding:6px;border-bottom:1px solid var(--line)">stateful (응답 자동 허용)</td><td style="padding:6px;border-bottom:1px solid var(--line)">stateless (인·아웃 따로)</td></tr>
          <tr><td style="padding:6px;border-bottom:1px solid var(--line)">규칙</td><td style="padding:6px;border-bottom:1px solid var(--line)">허용(allow)만</td><td style="padding:6px;border-bottom:1px solid var(--line)">허용·거부(deny) 모두</td></tr>
          <tr><td style="padding:6px">기본값</td><td style="padding:6px">모두 거부(명시 허용 필요)</td><td style="padding:6px">모두 허용</td></tr>
        </table>
      </div>
      <div class="scr"><div class="btnrow"><button class="btn primary ck" data-key="done">완료</button></div></div>`,
      cli:{ note:`규칙이 잘 들어갔는지 확인:`,
        lines:[ {p:"$",cmd:` aws ec2 describe-security-groups \\`}, {cmd:`   --group-ids sg-0ab12cd34ef56 \\`}, {cmd:`   --query 'SecurityGroups[].IpPermissions[].[FromPort,ToPort]'`}, {out:"22  22\\n80  80"} ],
        copy:"aws ec2 describe-security-groups --group-ids sg-0ab12cd34ef56 --query 'SecurityGroups[].IpPermissions[].[FromPort,ToPort]'",
        help:`수고했어요! 보안 그룹은 서버 앞단, NACL은 서브넷 앞단 방화벽이라는 차이만 기억하면 됩니다.` }
    }
  ]
},
{
  id:"route53", ch:7.3, icon:"🌐", name:"Route 53 (DNS)",
  label:"챕터 7.3 · Route 53 — 도메인을 ALB에 연결하기",
  doneMsg:"호스팅 영역에서 A 레코드(별칭)를 한 페이지로 만들어 www.example.com 을 로드 밸런서에 연결했어요. 사람이 외우는 도메인이 실제 AWS 리소스로 라우팅됩니다.",
  steps:[
    {
      title:"레코드 생성",
      intro:`${term("Route 53","AWS의 DNS·도메인 서비스")} 콘솔에서 <b>호스팅 영역(Hosted zones)</b> > <b>example.com</b> 을 선택한 화면입니다. 오른쪽 위 주황색 <b>레코드 생성(Create record)</b> 버튼을 누르면, 실제처럼 한 페이지짜리 설정 화면이 열립니다.`,
      console:`<div class="scr">
        <h4>호스팅 영역 · example.com</h4>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <p class="sub" style="margin:0">레코드 (2) — NS, SOA 기본 레코드만 있음</p>
          <button class="btn primary ck" data-key="create">레코드 생성</button>
        </div>
      </div>
      <div class="scr" style="text-align:center;color:var(--muted)">아직 www 레코드가 없습니다. 위 버튼으로 도메인을 리소스에 연결해 보세요.</div>`,
      cli:{ note:`CLI로는 현재 호스팅 영역의 레코드부터 확인해요.`,
        lines:[ {cmt:"# 호스팅 영역의 레코드 목록"}, {p:"$",cmd:` aws route53 `,flagHtml:flag("list-resource-record-sets","레코드 목록 조회")+` --hosted-zone-id Z123`}, {out:"NS, SOA (기본 레코드)"} ],
        copy:"aws route53 list-resource-record-sets --hosted-zone-id Z123", help:`<b>레코드 생성</b> 버튼 = CLI의 <b>change-resource-record-sets</b>.` }
    },

      intro:`웹페이지 파일인 index.html을 버킷에 올려요. 버킷 안에서 업로드 화면을 열고 파일 추가로 파일을 고른 뒤 업로드 버튼을 누르세요. (버킷 만들기와는 별개 화면이에요.)`,
      console:`<div class="scr"><h4>업로드</h4><p class="sub">my-beginner-site-2026 > 객체 > 업로드</p><div class="opt ck" data-key="addfile"><span class="ck-box"></span><div><div class="nm">파일 추가</div><div class="ds">로컬에서 올릴 파일 선택</div></div></div><div class="chip"><span class="fi">📄</span> index.html</div><div class="btnrow"><button class="btn primary ck" data-key="upload">업로드</button></div></div>`,
      cli:{ note:`cp 한 줄로 파일을 버킷에 복사해요.`, lines:[ {cmt:"# index.html을 버킷 루트로 업로드"}, {p:"$",cmd:` aws s3 `,flagHtml:flag("cp","파일을 버킷으로 복사/업로드")}, {out:"upload: ./index.html to s3://my-beginner-site-2026/index.html"} ], copy:"aws s3 cp index.html s3://my-beginner-site-2026/", help:`<b>팁</b> 폴더 통째로 올리려면 aws s3 cp ./site s3://버킷/ --recursive 처럼 --recursive를 씁니다.` } },

    { title:"정적 웹 사이트 호스팅 켜기", needs:2,
      intro:`버킷을 웹서버처럼 동작하게 만드는 ${term("정적 웹 사이트 호스팅","Static website hosting, 버킷의 파일을 웹페이지로 바로 제공하는 기능")}을 켭니다. 속성 탭에서 호스팅을 활성화하고 인덱스 문서로 index.html을 지정한 뒤 저장하세요. (속성 탭의 별개 화면이에요.)`,
      console:`<div class="scr"><h4>정적 웹 사이트 호스팅 편집</h4><p class="sub">my-beginner-site-2026 > 속성 > 정적 웹 사이트 호스팅 > 편집</p><div class="opt ck" data-key="enable"><span class="rd"></span><div><div class="nm">활성화</div><div class="ds">정적 웹 사이트 호스팅 사용</div></div></div><div class="field"><label>인덱스 문서</label><div class="input prefilled">index.html <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="save">변경 사항 저장</button></div></div>`,
      cli:{ note:`website 명령으로 호스팅과 인덱스 문서를 한 번에 설정해요.`, lines:[ {cmt:"# 정적 웹 사이트 호스팅 활성화 + 인덱스 문서 지정"}, {p:"$",cmd:` aws s3 `,flagHtml:flag("website","정적 웹 사이트 호스팅 설정")}, {out:"(출력 없음 — 적용 완료)"} ], copy:"aws s3 website s3://my-beginner-site-2026/ --index-document index.html", help:`<b>팁</b> 공개 접속이 403이면 버킷 정책으로 s3:GetObject 퍼블릭 읽기를 허용했는지 확인하세요.` } },

    { title:"완료 — 웹사이트 엔드포인트", finish:true,
      intro:`버킷이 웹서버가 됐어요! 속성 탭 맨 아래의 ${term("버킷 웹 사이트 엔드포인트","정적 웹 사이트 호스팅을 켜면 생기는 공개 접속 주소")} 주소로 누구나 페이지를 열 수 있어요. 완료 버튼으로 마무리하세요.`,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ 정적 웹사이트 준비 완료</h4><div class="rowsum"><span class="k">버킷</span><span class="v">my-beginner-site-2026</span></div><div class="rowsum"><span class="k">객체</span><span class="v">index.html</span></div><div class="rowsum"><span class="k">엔드포인트</span><span class="v">my-beginner-site-2026.s3-website.ap-northeast-2.amazonaws.com</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">완료</button></div></div>`,
      cli:{ note:`호스팅 설정을 조회해 엔드포인트 구성을 확인해요.`, lines:[ {p:"$",cmd:` aws s3api get-bucket-website --bucket my-beginner-site-2026`}, {out:"IndexDocument: { Suffix: index.html }"} ], copy:"aws s3api get-bucket-website --bucket my-beginner-site-2026", help:`수고했어요! 서버 한 대 없이 S3만으로 전 세계에 공개되는 웹페이지를 띄웠습니다.` } }
  ]
},
{
  id:"ebs", ch:9, icon:"💾", name:"EBS·EFS 스토리지", label:"챕터 9 · EBS/EFS/FSx — 서버에 붙이는 저장공간",
  doneMsg:"EBS 볼륨을 만들어 서버에 붙이고, 스냅샷으로 백업한 뒤, 여러 서버가 함께 쓰는 EFS까지 열어봤어요. 블록·파일 스토리지의 차이를 클릭으로 체험 완료!",
  steps:[
    { title:"EBS 볼륨 생성", needs:2,
      intro:`${term("EBS","Elastic Block Store, EC2 서버 한 대에 붙여 쓰는 블록 스토리지. 외장 하드처럼 한 대에만, 같은 가용 영역(AZ) 안에서만 붙습니다")} 볼륨을 새로 만듭니다. 크기 8GiB는 미리 채워 뒀고, 가용 영역은 붙일 인스턴스와 같은 ap-northeast-2a로 맞춰 뒀어요. 볼륨 유형은 대부분의 작업에 적당하고 저렴한 ${term("gp3","범용 SSD. 기본값으로 많이 쓰는 균형형 볼륨")}를 고르세요. ${term("io2","프로비저닝 IOPS SSD. DB처럼 아주 빠르고 안정적인 입출력이 필요할 때 선택")}는 비교용으로 옆에 뒀습니다.`,
      console:`<div class="scr"><h4>볼륨 생성</h4><p class="sub">EC2 > Elastic Block Store > 볼륨 > 볼륨 생성</p><p class="sub">볼륨 유형</p><div class="opt ck" data-key="gp3"><span class="rd"></span><div><div class="nm">범용 SSD (gp3)</div><div class="ds">기본값 · 균형형 · 저렴</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">프로비저닝 IOPS SSD (io2)</div><div class="ds">고성능 · DB용</div></div></div><div class="field"><label>크기(GiB)</label><div class="input prefilled">8 <span class="tag">입력됨</span></div></div><div class="field"><label>가용 영역</label><div class="input prefilled">ap-northeast-2a (인스턴스와 동일 AZ) <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="create">볼륨 생성</button></div></div>`,
      cli:{ note:`콘솔 대신 명령어 한 줄로도 똑같이 만듭니다.`,
        lines:[ {cmt:"# 서울 리전 ap-northeast-2a 에 8GiB gp3 볼륨 생성"}, {p:"$",cmd:` aws ec2 `,flagHtml:flag("create-volume","EBS 볼륨 생성")}, {out:"VolumeId: vol-0a1b2c3d  State: creating"} ],
        copy:"aws ec2 create-volume --availability-zone ap-northeast-2a --size 8 --volume-type gp3",
        help:`<b>팁</b> EBS는 반드시 서버와 같은 가용 영역(AZ)에 만들어야 붙일 수 있어요. 그래서 --availability-zone 을 꼭 지정합니다.` } },

    { title:"볼륨 연결(Attach volume)", needs:1,
      intro:`방금 만든 볼륨을 EC2 서버에 붙입니다. 외장 하드를 노트북 USB에 꽂는 것과 같아요. 볼륨을 선택하고 작업 > 볼륨 연결로 들어와 있으니, 인스턴스와 디바이스 이름을 확인하고 연결 버튼을 누르세요.`,
      console:`<div class="scr"><h4>볼륨 연결</h4><p class="sub">볼륨 vol-0a1b2c3d (8GiB gp3) > 작업 > 볼륨 연결</p><div class="field"><label>인스턴스</label><div class="input prefilled">i-0web01 (웹서버 · ap-northeast-2a) <span class="tag">입력됨</span></div></div><div class="field"><label>디바이스 이름</label><div class="input prefilled">/dev/sdf <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="attach">볼륨 연결</button></div></div>`,
      cli:{ note:`볼륨 ID 와 인스턴스 ID 를 이어 붙입니다.`,
        lines:[ {cmt:"# vol-... 을 i-... 서버의 /dev/sdf 로 붙이기"}, {p:"$",cmd:` aws ec2 `,flagHtml:flag("attach-volume","볼륨을 인스턴스에 연결")}, {out:"State: attaching -> in-use"} ],
        copy:"aws ec2 attach-volume --volume-id vol-0a1b2c3d --instance-id i-0web01 --device /dev/sdf",
        help:`<b>팁</b> 한 볼륨은 보통 서버 한 대에만 붙습니다. 여러 서버가 동시에 써야 하면 뒤에 나올 EFS 를 쓰세요.` } },

    { title:"스냅샷 생성(백업)", needs:1,
      intro:`${term("스냅샷","특정 시점의 볼륨 전체를 통째로 떠둔 백업. 내구성 높은 S3 에 저장되고, 변경분만 쌓여 비용이 절약됩니다")}을 떠서 지금 상태를 백업합니다. 실수로 지워도 스냅샷에서 되살릴 수 있어요. 스냅샷 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>스냅샷 생성</h4><p class="sub">볼륨 vol-0a1b2c3d > 작업 > 스냅샷 생성</p><div class="field"><label>설명</label><div class="input prefilled">web-backup-2026 <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="snapshot">스냅샷 생성</button></div></div>`,
      cli:{ note:`한 줄이면 백업이 시작됩니다.`,
        lines:[ {cmt:"# 볼륨 백업 스냅샷 생성"}, {p:"$",cmd:` aws ec2 `,flagHtml:flag("create-snapshot","볼륨 스냅샷(백업) 생성")}, {out:"SnapshotId: snap-0f9e8d7  Progress: 100%"} ],
        copy:"aws ec2 create-snapshot --volume-id vol-0a1b2c3d --description web-backup-2026",
        help:`<b>팁</b> 스냅샷은 S3 에 저장돼 가용 영역이 통째로 사라져도 안전합니다. 다른 AZ·리전으로 볼륨을 복제할 때도 스냅샷을 씁니다.` } },

    { title:"EFS 파일 시스템 생성", needs:1,
      intro:`이번엔 ${term("EFS","Elastic File System, 여러 서버가 동시에 같은 폴더처럼 마운트해 쓰는 파일 스토리지(NFS). 용량은 자동으로 늘고 줄어요")}를 만듭니다. EBS 가 한 서버 전용이라면, EFS 는 여러 대가 같은 파일을 함께 봅니다. ${term("FSx","Windows 파일 서버나 Lustre 같은 특수 파일시스템이 필요할 때 쓰는 관리형 서비스")}는 더 특수한 용도예요. 이름과 VPC를 확인하고 생성 버튼을 누르세요.`,
      console:`<div class="scr"><h4>파일 시스템 생성</h4><p class="sub">EFS > 파일 시스템 > 파일 시스템 생성</p><div class="field"><label>이름</label><div class="input prefilled">shared-docs <span class="tag">입력됨</span></div></div><div class="field"><label>Virtual Private Cloud (VPC)</label><div class="input prefilled">vpc-0a1b2c (기본 VPC) <span class="tag">입력됨</span></div></div><div class="rowsum"><span class="k">가용성 및 내구성</span><span class="v">리전 (여러 AZ)</span></div><div class="btnrow"><button class="btn primary ck" data-key="efs">생성</button></div></div>`,
      cli:{ note:`EFS 는 ec2 가 아니라 efs 명령을 씁니다.`,
        lines:[ {cmt:"# 공유 파일 시스템 생성"}, {p:"$",cmd:` aws efs `,flagHtml:flag("create-file-system","EFS 파일 시스템 생성")}, {out:"FileSystemId: fs-012abc  LifeCycleState: available"} ],
        copy:"aws efs create-file-system --tags Key=Name,Value=shared-docs",
        help:`<b>정리</b> EBS=한 서버 블록디스크, EFS=여러 서버 공유 파일, FSx=특수 파일시스템. 상황에 맞게 고르세요.` } },

    { title:"완료", finish:true,
      intro:`축하합니다! 이제 서버에 저장공간을 붙이고 백업하는 흐름을 이해했어요. 마침 버튼을 눌러 실습을 마칩니다.`,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ 스토리지 준비 완료</h4><div class="rowsum"><span class="k">EBS 볼륨</span><span class="v">vol-0a1b2c3d (8GiB gp3)</span></div><div class="rowsum"><span class="k">연결</span><span class="v">i-0web01 · /dev/sdf</span></div><div class="rowsum"><span class="k">스냅샷</span><span class="v">snap-0f9e8d7</span></div><div class="rowsum"><span class="k">EFS</span><span class="v">fs-012abc</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">실습 마치기</button></div></div>`,
      cli:{ note:`지금까지 만든 볼륨 목록을 확인해 봅니다.`,
        lines:[ {cmt:"# 내 볼륨 상태 조회"}, {p:"$",cmd:` aws ec2 describe-volumes`}, {out:"vol-0a1b2c3d  in-use  8GiB  gp3"} ],
        copy:"aws ec2 describe-volumes",
        help:`수고했어요! 블록(EBS)·파일(EFS)·특수(FSx) 스토리지의 차이를 몸으로 익혔습니다.` } }
  ]
},
{
  id:"rds", ch:10, icon:"🐬", name:"RDS 관리형 DB", label:"챕터 10 · RDS & Aurora — 관리형 데이터베이스",
  doneMsg:"실제 콘솔처럼 한 페이지에서 생성 방식·엔진·템플릿·연결·가용성까지 모두 정해 관리형 데이터베이스를 만들었어요. 설치·백업·패치·장애조치를 AWS 가 대신 해주는 RDS 의 흐름을 그대로 체험 완료!",
  steps:[
    {
      title:"데이터베이스 생성",
      intro:`${term("RDS","Relational Database Service. 데이터베이스 설치·백업·패치·장애복구를 AWS 가 대신 운영해 주는 관리형 관계형 DB 서비스")} 데이터베이스 목록 페이지입니다. 아직 만든 DB 가 없네요. 오른쪽 위 주황색 <b>데이터베이스 생성(Create database)</b> 버튼을 누르면, 실제처럼 한 페이지짜리 설정 화면이 열립니다.`,
      console:`<div class="scr">
        <h4>데이터베이스</h4>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <p class="sub" style="margin:0">RDS &gt; 데이터베이스 (0)</p>
          <button class="btn primary ck" data-key="createdb">데이터베이스 생성</button>
        </div>
      </div>
      <div class="scr" style="text-align:center;color:var(--muted)">아직 데이터베이스가 없습니다. 위 버튼으로 첫 DB 를 만들어 보세요.</div>`,
      cli:{ note:`CLI 는 목록 확인 → 한 줄로 생성(다음 페이지).`,
        lines:[ {cmt:"# 내 DB 인스턴스 목록 (서울 리전)"}, {p:"$",cmd:` aws rds `,flagHtml:flag("describe-db-instances","DB 인스턴스 목록 조회")}, {out:"DBInstances: []  (아직 없음)"} ],
        copy:"aws rds describe-db-instances --region ap-northeast-2",
        help:`<b>데이터베이스 생성</b> 버튼 = CLI 의 <b>create-db-instance</b>.` }
    },
    {
      title:"데이터베이스 생성 (설정)",
      intro:`실제 콘솔처럼 <b>한 페이지</b>에서 생성 방식·엔진·템플릿·설정·연결·가용성을 모두 정합니다. 모든 옵션을 직접 정하는 ${term("표준 생성","Standard create. 엔진·가용성·보안·백업까지 세부 설정을 전부 직접 지정하는 방식")}, 익숙한 ${term("MySQL","가장 널리 쓰이는 오픈소스 관계형 DB")} 엔진, 요금 걱정이 적은 ${term("프리 티어","Free tier. 가입 후 12개월간 db.t3.micro 등 작은 사양을 무료 범위로 쓸 수 있는 템플릿")} 를 고른 뒤, 퍼블릭 액세스와 ${term("다중 AZ 배포","Multi-AZ. 다른 가용영역에 대기 인스턴스를 두고 주 DB 가 죽으면 자동 장애조치(failover)하는 고가용성 구성")} 까지 정하고 오른쪽 <b>요약</b>의 <b>데이터베이스 생성</b>을 누르세요.`,
      needs:6,
      console:`<div class="awsform">
        <div class="formcol">

          <div class="scr">
            <h4>생성 방식 선택</h4>
            <div class="opt ck" data-key="standard"><span class="rd"></span><div><div class="nm">표준 생성 (Standard create)</div><div class="ds">모든 구성 옵션을 직접 설정 — 학습용 추천</div></div></div>
            <div class="opt locked"><span class="rd"></span><div><div class="nm">손쉬운 생성 (Easy create)</div><div class="ds">권장 모범 사례 기본값 사용</div></div></div>
          </div>

          <div class="scr">
            <h4>엔진 옵션</h4>
            <div class="opt ck" data-key="mysql"><span class="rd"></span><div><div class="nm">MySQL</div><div class="ds">익숙한 오픈소스 DB</div></div><span class="free">프리 티어 사용 가능</span></div>
            <div class="opt locked"><span class="rd"></span><div><div class="nm">Aurora(MySQL 호환)</div><div class="ds">더 빠르고 자동 확장 · AWS 전용</div></div></div>

        help:`콘솔의 한 페이지 = CLI 한 줄. 선택 항목이 곧 <b>--옵션</b>이에요. <b>--multi-az</b> = 고가용성, <b>--no-publicly-accessible</b> = 비공개.` }

        <h4 style="color:var(--ok)">✓ database-1 — 사용 가능</h4>

        <div class="rowsum"><span class="k">엔진 / 클래스</span><span class="v">MySQL · db.t3.micro</span></div>

    }

{
  id:"dynamodb", ch:11, icon:"⚡", name:"DynamoDB NoSQL", label:"챕터 11 · DynamoDB — 완전관리형 NoSQL",
  doneMsg:"DynamoDB 콘솔에서 Music 테이블을 한 페이지에서 파티션 키 Artist·정렬 키 SongTitle·온디맨드 용량·GSI 까지 설정해 만들고, 항목 탐색에서 첫 항목까지 넣어봤어요. 서버 관리 없이 자동 확장되는 NoSQL 의 흐름을 실제 콘솔 그대로 체험 완료!",
  steps:[
    { title:"테이블 생성", needs:1,
      intro:`${term("NoSQL","정해진 표 스키마 없이 키-값·문서 형태로 유연하게 저장하는 DB. 대용량·고속 처리에 강합니다")} 데이터베이스인 ${term("DynamoDB","서버 관리가 전혀 없고 트래픽에 맞춰 자동 확장되는 AWS 완전관리형 키-값 NoSQL")} 테이블 목록 페이지입니다. 오른쪽 위 주황색 <b>테이블 생성(Create table)</b> 버튼을 누르면, 실제처럼 한 페이지짜리 생성 화면이 열립니다.`,
      console:`<div class="scr"><h4>DynamoDB · 테이블</h4><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><p class="sub" style="margin:0">테이블 (0) · 서울</p><button class="btn primary ck" data-key="create">테이블 생성</button></div></div>
      <div class="scr" style="text-align:center;color:var(--muted)">아직 테이블이 없습니다. 위 버튼으로 첫 테이블을 만들어 보세요.</div>`,
      cli:{ note:`지금 있는 테이블 목록을 먼저 봅니다.`,
        lines:[ {cmt:"# 테이블 목록 조회 (서울 리전)"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("list-tables","테이블 목록 조회")}, {out:"TableNames: []"} ],
        copy:"aws dynamodb list-tables --region ap-northeast-2",
        help:`<b>팁</b> DynamoDB 는 서버 대수·패치·백업을 신경 쓸 필요가 없어요. 테이블만 만들면 끝입니다.` } },

    { title:"테이블 생성 (설정)", needs:4,
      intro:`실제 콘솔처럼 <b>한 페이지</b>에서 테이블 이름·${term("파티션 키","Partition key. 항목을 여러 서버(파티션)에 나눠 담는 기준 키. 값이 고르게 퍼지도록 골라야 함")}·${term("정렬 키","Sort key. 선택 사항. 같은 파티션 키 안에서 항목을 정렬·범위 조회하는 두 번째 키")}·용량 모드·${term("GSI","Global Secondary Index. 다른 속성을 키로 삼아 전체 테이블을 가로질러 조회하는 보조 색인. 생성 후에도 아무 때나 추가 가능")} 까지 모두 정합니다. 이름·키는 채워 뒀으니, 설정 사용자 지정과 ${term("온디맨드","On-demand. 미리 용량을 정하지 않고 쓴 만큼만 내는 방식. 트래픽이 들쭉날쭉하거나 예측이 어려울 때 편함")} 를 고르고 GSI 를 켠 뒤 맨 아래 <b>테이블 생성</b>을 누르세요.`,
      console:`<div class="scr"><h4>테이블 세부 정보</h4><div class="field"><label>테이블 이름</label><div class="input prefilled">Music <span class="tag">입력됨</span></div></div><div class="field"><label>파티션 키</label><div class="input prefilled">Artist (문자열) <span class="tag">입력됨</span></div></div><div class="field"><label>정렬 키 - 선택 사항</label><div class="input prefilled">SongTitle (문자열) <span class="tag">입력됨</span></div></div></div>
      <div class="scr"><h4>설정</h4><div class="opt locked"><span class="rd"></span><div><div class="nm">기본 설정</div><div class="ds">권장값 자동 적용</div></div></div><div class="opt ck" data-key="customize"><span class="rd"></span><div><div class="nm">설정 사용자 지정</div><div class="ds">용량·암호화·인덱스를 직접 지정</div></div></div></div>
      <div class="scr"><h4>읽기/쓰기 용량 설정</h4><div class="opt ck" data-key="ondemand"><span class="rd"></span><div><div class="nm">온디맨드 (On-demand)</div><div class="ds">쓴 만큼 과금 · 자동 확장</div></div></div><div class="opt locked"><span class="rd"></span><div><div class="nm">프로비저닝 (Provisioned)</div><div class="ds">용량 미리 지정 · 예측 트래픽용</div></div></div></div>
      <div class="scr"><h4>보조 인덱스 — 선택</h4><p class="sub">파티션 키가 아닌 다른 속성으로도 조회하려면</p><div class="opt ck" data-key="gsi"><span class="ck-box"></span><div><div class="nm">글로벌 보조 인덱스(GSI) 생성: AlbumTitle-index</div><div class="ds">AlbumTitle 속성으로 전체 조회</div></div></div></div>
      <div class="scr"><div class="btnrow"><button class="btn primary ck" data-key="create">테이블 생성</button></div></div>`,
      cli:{ note:`키 스키마·용량 모드를 함께 넘기면 한 줄로 생겨요.`,
        lines:[ {cmt:"# Artist=파티션(HASH), SongTitle=정렬(RANGE), 온디맨드"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("create-table","테이블 생성")}, {out:"TableStatus: CREATING -> ACTIVE"} ],
        copy:"aws dynamodb create-table --table-name Music --attribute-definitions AttributeName=Artist,AttributeType=S AttributeName=SongTitle,AttributeType=S --key-schema AttributeName=Artist,KeyType=HASH AttributeName=SongTitle,KeyType=RANGE --billing-mode PAY_PER_REQUEST",
        help:`<b>정리</b> GSI = 아무 속성·언제든 추가, LSI = 생성 시에만·같은 파티션 키. 온디맨드는 --billing-mode PAY_PER_REQUEST 예요.` } },

    { title:"항목 탐색 · 항목 생성", needs:1,
      intro:`테이블이 만들어지면 왼쪽 ${term("항목 탐색","Explore items. 테이블에 저장된 항목을 조회·추가·수정하는 화면")} 으로 들어가 ${term("항목 생성","Create item. 테이블에 새 데이터(항목) 하나를 넣는 버튼")} 을 누릅니다. Artist 와 SongTitle 이 미리 채워져 있으니 항목 생성 버튼만 누르면 돼요. (테이블 생성과는 별개 화면이에요.)`,
      console:`<div class="scr"><h4>항목 탐색 &gt; 항목 생성</h4><p class="sub">Music 테이블에 항목 추가</p><div class="field"><label>Artist (파티션 키)</label><div class="input prefilled">IU <span class="tag">입력됨</span></div></div><div class="field"><label>SongTitle (정렬 키)</label><div class="input prefilled">Love wins all <span class="tag">입력됨</span></div></div><div class="btnrow"><button class="btn primary ck" data-key="putitem">항목 생성</button></div></div>`,
      cli:{ note:`항목 하나를 JSON 으로 저장합니다.`,
        lines:[ {cmt:"# Music 테이블에 항목 1개 추가"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("put-item","항목 저장")}, {out:"(성공 · 반환값 없음)"} ],
        copy:"aws dynamodb put-item --table-name Music --item {\"Artist\":{\"S\":\"IU\"},\"SongTitle\":{\"S\":\"Love wins all\"}}",
        help:`<b>팁</b> 항목마다 속성 구성이 달라도 됩니다. 스키마가 고정되지 않은 게 NoSQL 의 특징이에요.` } },

    { title:"완료", finish:true,
      intro:`축하합니다! 서버 관리 없이 자동 확장되는 NoSQL 테이블을 한 페이지에서 만들고 첫 데이터까지 넣어봤어요. 확인 버튼으로 마무리하세요.`,
      console:`<div class="scr" style="border-color:var(--ok)"><h4 style="color:var(--ok)">✓ Music 테이블 준비 완료</h4><div class="rowsum"><span class="k">테이블</span><span class="v">Music</span></div><div class="rowsum"><span class="k">파티션 키</span><span class="v">Artist</span></div><div class="rowsum"><span class="k">정렬 키</span><span class="v">SongTitle</span></div><div class="rowsum"><span class="k">용량 모드</span><span class="v">온디맨드</span></div><div class="rowsum"><span class="k">GSI</span><span class="v">AlbumTitle-index</span></div><div class="rowsum"><span class="k">첫 항목</span><span class="v">IU / Love wins all</span></div><div class="btnrow"><button class="btn primary ck" data-key="done">실습 마치기</button></div></div>`,
      cli:{ note:`방금 넣은 항목을 다시 조회해 확인합니다.`,
        lines:[ {cmt:"# 파티션 키로 항목 조회"}, {p:"$",cmd:` aws dynamodb `,flagHtml:flag("get-item","항목 1건 조회")}, {out:"Item: { Artist: IU, SongTitle: Love wins all }"} ],
        copy:"aws dynamodb get-item --table-name Music --key {\"Artist\":{\"S\":\"IU\"},\"SongTitle\":{\"S\":\"Love wins all\"}}",
        help:`수고했어요! 파티션 키·정렬 키·GSI·온디맨드까지 실제 콘솔 흐름 그대로 NoSQL 테이블을 익혔습니다.` } }
  ]

{
  id:"analytics", ch:12, icon:"🔍", name:"Athena·Glue", label:"챕터 12 · 분석 — Glue 크롤러 + Athena 로 S3 를 SQL 쿼리",
